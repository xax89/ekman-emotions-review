<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+TC:wght@400;600;700;900&display=swap">
心理學家的面相術：解讀情緒的密碼 — 互動複習</title>
<style>
:root{
  --paper:#f6f0e2; --panel:#fffdf6; --card:#fffdf6; --ink:#475272; --muted:#8a8598;
  --line:#e4d9bf; --accent:#d96a5f; --accent-soft:#fbe4de;
  --teal:#3a9b88; --teal-soft:#e0f0ec;
  --name:#7b2cbf; --name-soft:#f0e8f8;
  --exam:#d96a5f; --exam-soft:#fbe4de;
  --good:#3a9b88; --good-bg:#e0f0ec;
  --bad:#d96a5f; --bad-bg:#fbe4de;
  --star:#c9a227;
  --shadow:0 1px 3px rgba(80,60,30,.08);
}
[data-theme="dark"]{
  --paper:#1f1c16; --panel:#2a2620; --card:#2a2620; --ink:#e6e0d2; --muted:#a0937a;
  --line:#3f3a2e; --accent:#e08a7a; --accent-soft:#3a2622;
  --teal:#5cc0a8; --teal-soft:#1f2e2a;
  --name:#b48dd9; --name-soft:#2e2638;
  --exam:#e58a7a; --exam-soft:#3a2422;
  --good:#5cc0a8; --good-bg:#1f2e2a;
  --bad:#e58a7a; --bad-bg:#3a2422;
  --star:#e0b44a; --shadow:0 1px 3px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Noto Serif TC","Songti TC","PingFang TC","Microsoft JhengHei",serif;
  background:var(--paper);color:var(--ink);line-height:1.8;font-size:16px}
/* top bar */
#topbar{position:sticky;top:0;z-index:60;height:56px;background:var(--panel);
  border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 16px}
#topbar .tb-btn{border:1px solid var(--line);background:var(--paper);border-radius:10px;
  cursor:pointer;color:var(--ink);white-space:nowrap;display:inline-flex;align-items:center;justify-content:center}
#topbar .tb-btn.ico{width:38px;height:38px;font-size:18px;padding:0}
#topbar .tb-btn:hover{border-color:var(--teal);color:var(--teal)}
#topbar .tb-btn.on{background:var(--teal);border-color:var(--teal);color:#fff}
#topbar #searchBox{position:relative;flex:1;max-width:520px}
#topbar #searchBox input{width:100%;padding:8px 12px;border:1px solid var(--line);
  border-radius:10px;background:var(--paper);color:var(--ink);font-family:inherit}
#searchResults{position:absolute;top:44px;left:0;right:0;background:var(--panel);
  border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 20px rgba(80,60,30,.18);
  max-height:60vh;overflow:auto;z-index:70}
#searchResults div{padding:8px 12px;border-bottom:1px solid var(--line);cursor:pointer;font-size:13px}
#searchResults div:hover{background:var(--teal-soft)}
#topbar .spacer{flex:1}
@media(max-width:860px){
  #topbar #searchBox{max-width:none}
}
/* layout */
#layout{display:flex;min-height:calc(100vh - 56px)}
#sidebar{width:280px;flex:0 0 280px;background:var(--paper);border-right:1px solid var(--line);
  position:fixed;top:56px;bottom:0;left:0;overflow-y:auto;padding:16px 0;transition:transform .25s;z-index:40}
#main{margin-left:280px;flex:1;padding:28px 34px}
#content{max-width:900px;margin:0 auto}
@media(max-width:860px){
  #sidebar{transform:translateX(-100%)}
  #sidebar.open{transform:translateX(0)}
  #main{margin-left:0;padding:18px}
  #menuBtn{display:inline-flex !important}
}
#menuBtn{display:none;background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:6px 12px;cursor:pointer;font-size:16px;margin:0}
/* sidebar */
.nav-btn{display:block;width:calc(100% - 24px);margin:8px 12px;padding:8px 10px;border:none;
  background:var(--panel);border-radius:10px;cursor:pointer;text-align:left;font-size:14px;color:var(--ink)}
.nav-btn:hover{background:var(--teal-soft);color:var(--teal)}
.toc{list-style:none;margin:8px 0;padding:0}
.toc a{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 18px;
  color:var(--ink);text-decoration:none;font-size:14px;border-left:3px solid transparent}
.toc a:hover{background:var(--teal-soft)}
.toc a.active{border-left-color:var(--teal);background:var(--teal-soft);font-weight:700;color:var(--teal)}
.pct{font-size:11px;color:var(--muted);white-space:nowrap}
/* content blocks */
h2.chap{font-size:26px;border-left:8px solid var(--teal);padding:4px 0 8px 16px;margin-top:0;font-family:"Noto Serif TC",serif}
h3{font-size:19px;margin-top:28px;color:var(--accent)}
.lead{color:var(--muted)}
ul.pts li{margin-bottom:6px}
details.sec{border:1px solid var(--line);border-radius:12px;margin:12px 0;background:var(--panel);overflow:hidden}
details.sec summary{cursor:pointer;padding:13px 18px;font-weight:700;list-style:none;font-size:16px}
details.sec summary::-webkit-details-marker{display:none}
details.sec summary::before{content:"▸ ";color:var(--teal)}
details.sec[open] summary{border-bottom:1px solid var(--line)}
details.sec[open] summary::before{content:"▾ "}
.sec-body{padding:8px 20px 16px}
.sec-body p{margin:10px 0}
/* terms inline */
.t{color:var(--teal);font-weight:700;cursor:pointer;border-bottom:1.5px dashed var(--teal)}
.n{color:var(--name);font-weight:700;cursor:pointer;border-bottom:1.5px dashed var(--name)}
/* method card */
.card{border:1px solid var(--line);border-radius:12px;margin:14px 0;background:var(--card);box-shadow:var(--shadow);overflow:hidden}
.card.dim{opacity:.55;text-decoration:line-through}
.card-top{display:flex;align-items:flex-start}
.card-name{flex:0 0 34%;align-self:flex-start;padding:12px 14px;font-weight:700;
  border:1.5px solid var(--teal);border-radius:10px;background:var(--teal-soft);margin:14px 0 0 14px;color:var(--teal)}
.card-body{flex:1;padding:14px 16px}
.card-formula{font-weight:600;margin-bottom:6px}
.card-ex{font-size:14px;color:var(--muted);border-top:1px dashed var(--line);margin-top:10px;padding-top:8px}
.card-foot{display:flex;align-items:center;gap:10px;padding:8px 16px;border-top:1px solid var(--line);font-size:13px}
/* table */
table.cmp{width:100%;border-collapse:collapse;margin:12px 0;font-size:14px;background:var(--panel);border-radius:10px;overflow:hidden}
table.cmp th,table.cmp td;border:1px solid var(--line);padding:9px 11px;text-align:left;vertical-align:top}
table.cmp th{background:var(--teal-soft);color:var(--teal);width:33%}
/* exam callout */
.exambox{background:var(--exam-soft);border-left:4px solid var(--exam);border-radius:0 10px 10px 0;padding:12px 16px;margin:16px 0}
.exambox h4{margin:0 0 6px;color:var(--exam)}
/* quiz */
.quiz{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:12px 0;background:var(--panel)}
.quiz .q{font-weight:700;margin-bottom:8px}
.quiz .opts{display:flex;flex-direction:column;gap:6px}
.quiz .opt{border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer;background:var(--paper)}
.quiz .opt:hover{border-color:var(--teal)}
.quiz .opt.correct{background:var(--good-bg);border-color:var(--good);color:var(--good);font-weight:700}
.quiz .opt.wrong{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.quiz .opts.locked .opt{cursor:default}
.quiz .exp{display:none;margin-top:8px;font-size:14px;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px}
.quiz .exp.show{display:block}
.quiz .flags{display:flex;gap:14px;margin-top:10px;font-size:13px}
.quiz .flags button{background:none;border:none;cursor:pointer;color:var(--muted);font-size:14px}
.quiz .redo{font-size:12px}
/* term table */
.termtbl{width:100%;border-collapse:collapse;font-size:14px;margin:10px 0;background:var(--panel)}
.termtbl th,.termtbl td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
.termtbl th{background:var(--teal-soft);color:var(--teal)}
/* progress bar */
.pbar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:8px 0}
.pbar > div{height:100%;background:var(--teal);transition:width .3s}
/* home grid */
.chap-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin-top:16px}
.chap-card{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--panel);cursor:pointer}
.chap-card:hover{border-color:var(--teal);transform:translateY(-2px);box-shadow:var(--shadow)}
.chap-card h4{margin:0 0 6px}
.chap-card .meta{font-size:12px;color:var(--muted)}
/* modal */
#modal{position:fixed;inset:0;background:rgba(40,30,20,.4);display:none;align-items:center;justify-content:center;z-index:100}
#modal.show{display:flex}
#modalBox{background:var(--panel);border-radius:14px;max-width:440px;width:90%;padding:22px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
#modalBox h3{margin-top:0}
#modalBox .close{float:right;cursor:pointer;color:var(--muted)}
/* highlight */
.marked{background:#ffe94a}
[data-theme="dark"] .marked{background:#5a4d1e}
/* misc */
.notearea{width:100%;min-height:48px;margin-top:6px;border:1px dashed var(--line);border-radius:10px;padding:6px;background:var(--paper);color:var(--ink)}
.small{font-size:12px;color:var(--muted)}
.row-between{display:flex;justify-content:space-between;align-items:center}
.tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:10px;background:var(--teal-soft);color:var(--teal);margin-left:6px}
svg{width:100%;height:auto;display:block;background:var(--panel);
  border:1px solid var(--line);border-radius:10px;margin:8px 0}
.author-row{display:flex;gap:18px;align-items:center;margin:14px 0;flex-wrap:wrap}
.author-row img.portrait{width:90px;height:108px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.author-row img.cover{width:72px;height:108px;object-fit:cover;border-radius:6px;box-shadow:var(--shadow)}
.film-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin:12px 0}
.film-grid img{width:100%;border-radius:8px;border:1px solid var(--line);display:block}
.film-grid figcaption{font-size:12px;text-align:center;color:var(--muted);margin-top:4px}
.booklink{display:block;border:2px dashed var(--accent);border-radius:12px;padding:16px;margin:14px 0;
  text-decoration:none;color:var(--ink);background:var(--accent-soft)}
.booklink h4{margin:0 0 4px;color:var(--accent)}
@media(max-width:860px){
  .card-top{flex-direction:column}
  .card-name{flex:none;margin:14px 14px 0}
}
</style>
</head>
<body>
<div id="topbar">
  <button id="menuBtn" class="tb-btn ico" title="目錄" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
  <button class="tb-btn ico" title="回書架首頁（識謊・讀心）" onclick="location.href='index.html'">⌂</button>
  <div id="searchBox"><input id="searchInput" placeholder="搜尋章節／例題／術語…" oninput="doSearch(this.value)"><div id="searchResults"></div></div>
  <span class="spacer"></span>
  <button class="tb-btn ico" id="markBtn" title="畫記模式" onclick="toggleMark()">✎</button>
  <button class="tb-btn ico" id="darkBtn" title="深色模式" onclick="toggleDark()">◐</button>
</div>
<div id="layout">
  <nav id="sidebar">
    <button class="nav-btn" onclick="go('home')">≡ 本書總覽</button>
    <button class="nav-btn" title="答錯自動收入此處" onclick="go('mistakes')">✗ 錯題本</button>
    <button class="nav-btn" title="全書術語總表" onclick="go('glossary')">Aa 術語總表</button>
    <ul class="toc" id="tocList"></ul>
  </nav>
  <main id="main">
    <div id="content" style="max-width:900px;margin:0 auto"></div>
  </main>
</div>
<div id="modal"><div id="modalBox"></div></div>

<script>
/* ============ 資料 ============ */
const BOOK = {
  title:"心理學家的面相術：解讀情緒的密碼",
  chapters:[
  { id:1, title:"第一章　跨越文化的情緒", page:"書頁 001",
    points:[
      "情緒的臉部表情具有<span class='t' data-k='universal'>跨文化共通性</span>：不同文化的人對同一表情所辨識出的情緒有高度共識。",
      "達爾文主張表情是與生俱來、普遍共通的；米德、博懷斯特爾等文化人類學家則主張表情是社交學習的產物、各文化不同。",
      "作者最初站在「文化學習」立場，研究結果卻與預期相反，反而支持達爾文。",
      "<span class='t' data-k='displayrules'>表露的規則</span>（display rules）是社交學習而來、有文化差異，會壓抑或掩飾真實情緒的表達——這解釋了為何公開場合上表情看起來有文化差異。",
      "符號性的姿勢（如點頭）確實有文化差異；但情緒的臉部表情本身是普世共通的。",
      "新幾內亞<span class='n' data-k='fore'>福爾人（Fore）</span>等與世隔絕、未受媒體影響的文化，仍能正確辨識白種人照片的情緒，強力支持共通性。",
    ],
    sections:[
      {title:"1.1　研究緣起：從手到臉", paras:[
        "作者 1950 年代末先研究<span class='n' data-k='handmove'>手部動作</span>的分類，用以分辨憂鬱病人屬於精神官能症還是精神病。1965 年因兩個機緣轉向臉部表情：一是意外獲得研究跨文化非口語行為的經費，二是結識主張「表情與生俱來」的<span class='n' data-k='tomkins'>席爾旺·湯金斯（Silvan Tomkins）</span>。",
        "作者原本相信表情和姿勢都是社交學習而有文化差異，連<span class='n' data-k='mead'>瑪格麗特·米德（Margaret Mead）</span>等前輩都如此主張。真正的問題於是變成：<span class='t' data-k='question'>表情是普世共通，還是像語言一樣各文化不同？</span>"
      ]},
      {title:"1.2　五種文化的照片實驗", paras:[
        "作者向智利、阿根廷、巴西、日本、美國五種文化的人展示臉部表情照片，請他們判斷各表達何種情緒。結果不同文化的人對大部分情緒都有共識。<span class='n' data-k='izard'>卡羅爾·伊扎德（Carroll Izard）</span>獨立做相同實驗，得到一致結果。",
        "這個發現與當時主流（文化人類學）相反，作者強調：行為科學中，違反研究者預期、且被獨立團隊重複驗證的結果更可信。"
      ]},
      {title:"1.3　表露的規則解決矛盾", paras:[
        "為何人類學家觀察到表情有文化差異？作者提出<span class='t' data-k='displayrules'>表露的規則</span>：它們在社交中學習、常有文化差異，規定「可以向誰、在何時、如何表現某種情緒」。例如公開比賽中輸家不表露難過；父母告誡「不要得意忘形」。",
        "實證：日本人和美國人獨自觀看噁心影片時表情相同；但有科學家在場時，日本人更常用微笑掩飾負面表情。獨處時表現與生俱來的表情，公開場合則受規則控制。"
      ]},
      {title:"1.4　新幾內亞的關鍵證據", paras:[
        "為排除「受試者從電影電視學到西方表情」的漏洞，作者前往<span class='n' data-k='gajdusek'>葛吉謝克（Carleton Gajdusek）</span>研究過、與世隔絕的新幾內亞高地。透過記錄片觀察，當地人並無任何「我們看不懂的新奇表情」，且在只有臉部特寫、不見社交脈絡時，湯金斯仍能正確解讀其表情。",
        "1967 年作者親赴東南高地研究<span class='n' data-k='fore'>福爾人（Fore）</span>：他們沒看過電影電視、很少接觸外人，卻能正確把照片對應到情緒故事，且不覺得福爾人與美國人的照片有何不同。這排除了媒體學習的解釋。"
      ]},
    ],
    cards:[
      {name:"跨文化共通性實驗法", formula:"各文化受試者 → 判斷相同表情照片 → 計算「正確辨識共識率」",
       detail:"控制文化變因，比較不同文化對同一臉部表情的情緒判斷是否一致。一致 → 傾向普世共通。",
       example:"五國受試者看同一張「驚訝」臉，若多數都答「驚訝」，即支持共通性。"},
      {name:"區分「表情」與「表露規則」", formula:"與生俱來的表情（跨文化一致） ╳ 文化習得的規則（壓抑／掩飾）",
       detail:"獨處 vs 公開場合對比：獨處時露出真實表情，公開時受規則控制，兩者不矛盾。",
       example:"日本人獨自看噁心影片時與美國人表情相同；有旁人時才用微笑掩飾。"}
    ],
    tables:[
      {title:"普世表情 vs 文化特有表現", headers:["類別","性質","例"], rows:[
        ["基本情緒的臉部表情","與生俱來、跨文化共通","憤怒、害怕、嫌惡、悲傷、驚訝等的特定肌肉組合"],
        ["表露的規則","社交學習、有文化差異","何時可表現、對誰表現、要否掩飾"],
        ["符號性手勢／姿勢","文化特有","點頭、手勢等象徵性動作各文化不同"]
      ]}
    ],
    svg:"flow1",
    exam:[
      {q:"作者最初研究的對象是什麼？",opts:["臉部表情","手部動作","聲音語調","姿勢"],a:1,ex:"作者 1950 年代末先研究手部動作分類，用以分辨病人病況，後來才轉向臉部表情。"},
      {q:"「表露的規則（display rules）」是什麼性質？",opts:["與生俱來、跨文化一致","社交學習而來、常有文化差異","完全不受文化影響","只適用於兒童"],a:1,ex:"表露的規則在社交中學習，規定可向誰、何時、如何表現情緒，因此有文化差異。"},
      {q:"為何獨處時與有旁人時，日本人看噁心影片的表情不同？",opts:["生理反應不同","表露的規則在公開場合壓抑／掩飾真實表情","影片內容不同","性別差異"],a:1,ex:"獨處時表現與生俱來的表情；公開場合受表露規則控制，日本人更常用微笑掩飾負面表情。"},
      {q:"新幾內亞福爾人研究最重要的價值是？",opts:["他們發明了新表情","排除「從電影電視學來西方表情」的反對意見","證明表情完全隨文化改變","證明照片無法被文盲看懂"],a:1,ex:"福爾人與世隔絕、未受媒體影響，仍能正確辨識照片情緒，排除了媒體學習的解釋。"},
      {q:"下列何者具有文化差異？",opts:["基本情緒的臉部肌肉組合","符號性的點頭等姿勢","天生失明者的表情","憤怒時的眉毛緊皺"],a:1,ex:"情緒的臉部表情是普世共通；符號性姿勢（如點頭）才是文化特有。"},
      {q:"達爾文與米德對表情起源的主張分別是？",opts:["達爾文主張文化習得、米德主張與生俱來","兩人都主張與生俱來","達爾文主張與生俱來普遍共通、米德等主張社交學習","兩人都主張文化習得"],a:2,ex:"達爾文認為表情與生俱來；米德、博懷斯特爾等主流人類學家認為表情是社交學習的產物。"},

/* ============ 狀態 ============ */
const KEY='ekman_review_v1';
function loadState(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return{}}}
function saveState(s){localStorage.setItem(KEY,JSON.stringify(s))}
let S=loadState();
S.cards=S.cards||{};        // cardKey -> true(學會)
S.qdone=S.qdone||{};        // qKey -> {done, star, correct, marked}
S.terms=S.terms||{};        // termKey -> {learned, star, note}
S.hl=S.hl||[];              // highlighted paragraph keys
S.dark=!!S.dark;
S.mark=false;
function persist(){saveState(S)}

/* ============ 工具 ============ */
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function chapIdFromHash(){const h=location.hash||'#/home';const m=h.match(/chapter\/(\d+)/);return m?+m[1]:null}

/* 收集全文（供搜尋） */
function allSearchItems(){
  const items=[];
  BOOK.chapters.forEach(c=>{
    items.push({type:'章節',text:c.title,go:`#/chapter/${c.id}`});
    c.points.forEach(p=>items.push({type:'重點',text:stripHtml(p),go:`#/chapter/${c.id}`}));
    c.exam.forEach((q,i)=>items.push({type:'例題',text:`Q:${q.q}`,go:`#/chapter/${c.id}`,qk:`q${c.id}_${i}`}));
    c.terms.forEach(t=>items.push({type:'術語',text:`${t.zh} ${t.en}`,go:`#/chapter/${c.id}`,tk:`t${c.id}_${t.en}`}));
  });
  items.push({type:'頁面',text:'錯題本',go:'#/mistakes'});
  items.push({type:'頁面',text:'術語總表',go:'#/glossary'});
  return items;
}
function stripHtml(s){return s.replace(/<[^>]+>/g,'')}

/* ============ 渲染側欄 ============ */
function renderTOC(){
  const el=document.getElementById('tocList');
  let html='';
  BOOK.chapters.forEach(c=>{
    const pct=chapPercent(c);
    html+=`<a href="#/chapter/${c.id}" class="${chapIdFromHash()===c.id?'active':''}">
      <span>${c.title}</span><span class="pct">${pct}%</span></a>`;
  });
  el.innerHTML=html;
}
function chapPercent(c){
  // 方法卡完成率 + 例題完成率 平均
  const cards=c.cards.length||1;
  const cd=c.cards.filter((_,i)=>S.cards[`c${c.id}_${i}`]).length;
  const qs=c.exam.length||1;
  const qd=c.exam.filter((_,i)=>S.qdone[`q${c.id}_${i}`]&&S.qdone[`q${c.id}_${i}`].done).length;
  return Math.round(((cd/cards)+(qd/qs))/2*100);
}

/* ============ 主內容 ============ */
function render(){
  renderTOC();
  const cid=chapIdFromHash();
  const main=document.getElementById('content');
  if(location.hash==='#/mistakes'){main.innerHTML=renderMistakes();bindMistakes();return}
  if(location.hash==='#/glossary'){main.innerHTML=renderGlossary();return}
  if(cid==null){main.innerHTML=renderHome();bindHome();return}
  const c=BOOK.chapters.find(x=>x.id===cid);
  main.innerHTML=renderChapter(c);
  bindChapter(c);
}

function renderChapter(c){
  const pct=chapPercent(c);
  const qd=c.exam.filter((_,i)=>S.qdone[`q${c.id}_${i}`]&&S.qdone[`q${c.id}_${i}`].done).length;
  let h=`<h2 class="chap">${c.title}<span class="tag">${c.page}</span></h2>
  <div class="row-between"><span class="small">本章總完成 ${pct}% ｜ 例題已做 ${qd}/${c.exam.length}</span>
  <button class="tb-btn ico" title="回書架首頁" onclick="location.href='index.html'">⌂</button></div>
  <div class="pbar"><div style="width:${pct}%"></div></div>

  <h3>本章重點</h3><ul class="pts">${c.points.map(p=>`<li data-p="${c.id}_${uuid(p)}">${p}</li>`).join('')}</ul>
  <div class="exambox"><h4>考試重點</h4><div>掌握「普世表情 vs 表露規則」「自動評估毫秒啟動」「各情緒核心主題與行動傾向」「真笑杜興尼特徵」。</div></div>
  <h3>小節</h3>`;
  c.sections.forEach(s=>{
    h+=`<details class="sec"><summary>${s.title}</summary><div class="sec-body">`;
    s.paras.forEach((p,i)=>h+=`<p data-p="${c.id}_${uuid(s.title+i+p)}">${p}</p>`);
    h+=`</div></details>`;
  });
  if(c.cards.length){
    h+=`<h3>方法卡</h3>`;
    c.cards.forEach((card,i)=>{
      const k=`c${c.id}_${i}`;const done=S.cards[k];
      h+=`<div class="card ${done?'dim':''}">
        <div class="card-top"><div class="card-name">${card.name}</div>
        <div class="card-body"><div class="card-formula">${card.formula}</div><div>${card.detail}</div>
        <div class="card-ex">例：${card.example}</div></div></div>
        <div class="card-foot"><input type="checkbox" id="${k}" ${done?'checked':''} onchange="toggleCard('${k}',this.checked)">
        <label for="${k}">學會</label></div></div>`;
    });
  }
  c.tables.forEach(t=>{
    h+=`<h3>${t.title}</h3><table class="cmp"><tr>${t.headers.map(x=>`<th>${x}</th>`).join('')}</tr>`;
    t.rows.forEach(r=>h+=`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`);
    h+=`</table>`;
  });
  if(c.svg)h+=`<h3>示意圖</h3>${svgFor(c.svg)}`;
  h+=`<h3>例題（答題式）</h3>`;
  c.exam.forEach((q,i)=>{
    const k=`q${c.id}_${i}`;const st=S.qdone[k]||{};
    h+=`<div class="quiz" id="quiz_${k}"><div class="q">${i+1}. ${q.q}</div>
    <div class="opts" data-qk="${k}">`;
    q.opts.forEach((o,oi)=>{
      let cls='opt';
      if(st.done){ if(oi===q.a)cls+=' correct'; else if(oi===st.picked)cls+=' wrong'; }
      h+=`<div class="${cls}" data-oi="${oi}" onclick="answer(this,'${k}')">${String.fromCharCode(65+oi)}. ${o}</div>`;
    });
    h+=`</div><div class="exp ${st.done?'show':''}" id="exp_${k}">解析：${q.expl}（正確答案：${String.fromCharCode(65+q.a)}）</div>
    <div class="flags">
      <button onclick="flagQ('${k}','done',this)">${st.done?'☑ 做過':'☐ 做過'}</button>
      <button onclick="flagQ('${k}','star',this)">${st.star?'★ 收藏':'☆ 收藏'}</button>
      ${st.done&&!st.correct?'<span class="small" style="color:var(--bad)">（已自動收入錯題本）</span>':''}
      <button class="redo" onclick="redoQ('${k}')">重做</button>
    </div></div>`;
  });
  if(c.terms.length){
    h+=`<h3>本章術語</h3><table class="termtbl"><tr><th>術語</th><th>外文</th><th>解釋</th><th>學會</th><th>重點</th><th>筆記</th></tr>`;
    c.terms.forEach((t,i)=>{
      const tk=`t${c.id}_${t.en}`;const tt=S.terms[tk]||{};
      h+=`<tr><td><b>${t.zh}</b></td><td class="small">${t.en}</td><td>${t.def}</td>
      <td><input type="checkbox" ${tt.learned?'checked':''} onchange="setTerm('${tk}','learned',this.checked)"></td>
      <td><button onclick="setTerm('${tk}','star',!(S.terms['${tk}']||{}).star,this)">${tt.star?'★':'☆'}</button></td>
      <td><input class="notearea" style="min-height:30px" value="${esc(tt.note||'')}" onchange="setTerm('${tk}','note',this.value)"></td></tr>`;
    });
    h+=`</table>`;
  }
  return h;
}
function bindChapter(c){
  // inline term click -> modal
  document.querySelectorAll('.t,.n').forEach(el=>{
    el.onclick=()=>{
      const k=el.dataset.k;
      const term=BOOK.chapters.flatMap(x=>x.terms).find(t=>t.en===k);
      showModal(term?`<h3>${term.zh} <small class="small">${term.en}</small></h3><p>${term.def}</p>`:`<h3>${el.textContent}</h3><p class="small">（詳見本章術語表）</p>`);
    };
  });
  // highlight mode
  document.querySelectorAll('[data-p]').forEach(el=>{
    el.onclick=(e)=>{
      if(!S.mark)return;
      e.preventDefault();
      const p=el.dataset.p;
      const i=S.hl.indexOf(p);
      if(i>=0){S.hl.splice(i,1);el.classList.remove('marked')}
      else{S.hl.push(p);el.classList.add('marked')}
      persist();
    };
    if(S.hl.includes(el.dataset.p))el.classList.add('marked');
  });
}

function uuid(s){let h=0;for(let i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))>>>0}return h.toString(36)}

/* ============ 互動 ============ */
function toggleCard(k,v){S.cards[k]=v;persist();render()}
function answer(el,k){
  const box=document.getElementById('quiz_'+k);
  if(box.querySelector('.opts.locked'))return;
  const cid=+k.match(/q(\d+)_/)[1];const qi=+k.split('_')[1];
  const c=BOOK.chapters.find(x=>x.id===cid);const q=c.exam[qi];
  const picked=+el.dataset.oi;
  box.querySelector('.opts').classList.add('locked');
  q.opts.forEach((o,oi)=>{
    const oe=box.querySelector(`.opt[data-oi="${oi}"]`);
    if(oi===q.a)oe.classList.add('correct');
    else if(oi===picked)oe.classList.add('wrong');
  });
  document.getElementById('exp_'+k).classList.add('show');
  S.qdone[k]={done:true,star:(S.qdone[k]||{}).star||false,correct:picked===q.a,picked:picked};
  persist();renderTOC();
  // refresh flags row
  box.querySelector('.flags').innerHTML=
    `<button onclick="flagQ('${k}','done',this)">☑ 做過</button>`+
    `<button onclick="flagQ('${k}','star',this)">${S.qdone[k].star?'★ 收藏':'☆ 收藏'}</button>`+
    `<span class="small" style="color:var(--bad)">答錯已收入錯題本</span>`+
    `<button class="redo" onclick="redoQ('${k}')">重做</button>`;
}
function flagQ(k,field,btn){
  S.qdone[k]=S.qdone[k]||{done:false,star:false,correct:false};
  S.qdone[k][field]=!S.qdone[k][field];
  if(field==='done'&&!S.qdone[k].done)delete S.qdone[k];
  persist();render();
}
function redoQ(k){delete S.qdone[k];persist();render()}
function setTerm(tk,field,val){
  S.terms[tk]=S.terms[tk]||{};S.terms[tk][field]=val;persist();
  if(field==='star')render();
}
function toggleMark(){S.mark=!S.mark;persist();applyTheme();
  if(S.mark){document.querySelectorAll('[data-p]').forEach(el=>el.style.cursor='pointer')}
  else{document.querySelectorAll('[data-p]').forEach(el=>el.style.cursor='')}
}
function toggleDark(){S.dark=!S.dark;persist();applyTheme();}
function applyTheme(){
  document.documentElement.setAttribute('data-theme',S.dark?'dark':'light');
  const mb=document.getElementById('markBtn');if(mb)mb.classList.toggle('on',!!S.mark);
  const db=document.getElementById('darkBtn');if(db)db.classList.toggle('on',!!S.dark);
}

/* ============ 錯題本 ============ */
function renderMistakes(){
  let items=[];
  BOOK.chapters.forEach(c=>c.exam.forEach((q,i)=>{
    const k=`q${c.id}_${i}`;const st=S.qdone[k];
    if(st&&st.done&&!st.correct&&!st.fixed)items.push({c,q,k,st});
  }));
  let h=`<h2 class="chap">錯題本</h2><p class="lead">答錯的題目自動收錄於此；標記「已訂正」後移出。</p>`;
  if(!items.length)h+=`<p class="small">目前沒有錯題。</p>`;
  items.forEach(({c,q,k})=>{
    h+=`<div class="quiz"><div class="q">【${c.title}】${q.q}</div>
    <div class="opts locked">${q.opts.map((o,oi)=>{
      let cls='opt';if(oi===q.a)cls+=' correct';
      return `<div class="${cls}">${String.fromCharCode(65+oi)}. ${o}</div>`;}).join('')}</div>
    <div class="exp show">解析：${q.expl}</div>
    <div class="flags"><button onclick="fixQ('${k}')">☑ 標記已訂正</button>
    <button onclick="location.hash='#/chapter/${c.id}'" style="font-size:13px">回到本章</button></div></div>`;
  });
  return h;
}

function bindMistakes(){}

/* ============ 術語總表 ============ */
function renderGlossary(){
  let rows=[];
  BOOK.chapters.forEach(c=>c.terms.forEach(t=>{
    const tk=`t${c.id}_${t.en}`;const tt=S.terms[tk]||{};
    rows.push({chap:c.title,zh:t.zh,en:t.en,def:t.def,tk,tt});
  }));
  let h=`<h2 class="chap">術語總表</h2>
  <p class="lead">全書術語。可依「已學會／重點」篩選；筆記與打勾自動儲存。</p>
  <div class="tool-row"><button onclick="filterGloss('all')">全部</button>
  <button onclick="filterGloss('learned')">已學會</button>
  <button onclick="filterGloss('star')">★ 重點</button></div>
  <table class="termtbl" id="glossTable"><tr><th>所屬章</th><th>術語</th><th>外文</th><th>解釋</th><th>學會</th><th>重點</th></tr>`;
  rows.forEach(r=>{
    h+=`<tr data-learned="${r.tt.learned?1:0}" data-star="${r.tt.star?1:0}">
    <td class="small">${r.chap}</td><td><b>${r.zh}</b></td><td class="small">${r.en}</td><td>${r.def}</td>
    <td><input type="checkbox" ${r.tt.learned?'checked':''} onchange="setTerm('${r.tk}','learned',this.checked)"></td>
    <td><button onclick="setTerm('${r.tk}','star',true)">${r.tt.star?'★':'☆'}</button></td></tr>`;
  });
  h+=`</table>`;
  return h;
}
function filterGloss(mode){
  document.querySelectorAll('#glossTable tr[data-learned]').forEach(tr=>{
    if(mode==='all')tr.style.display='';
    else if(mode==='learned')tr.style.display=tr.dataset.learned==='1'?'':'none';
    else tr.style.display=tr.dataset.star==='1'?'':'none';
  });
}

/* ============ 搜尋 ============ */
function doSearch(q){
  const box=document.getElementById('searchResults');
  q=q.trim();
  if(!q){box.innerHTML='';return}
  const items=allSearchItems().filter(it=>it.text.toLowerCase().includes(q.toLowerCase())).slice(0,12);
  box.innerHTML=items.map(it=>`<div onclick="jumpResult('${it.go}',this)">【${it.type}】${it.text.slice(0,40)}</div>`).join('')
    ||'<div class="small">無結果</div>';
}
function jumpResult(go,el){location.hash=go;document.getElementById('searchResults').innerHTML='';document.getElementById('searchInput').value='';
  document.getElementById('sidebar').classList.remove('open');}

/* ============ JSON 進出 ============ */
function exportJSON(){
  const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ekman_review_progress.json';a.click();
}
function importJSON(ev){
  const f=ev.target.files[0];if(!f)return;
  const r=new FileReader();r.onload=()=>{try{S=JSON.parse(r.result);persist();render()}catch(e){alert('檔案格式錯誤')}};
  r.readAsText(f);
}

/* ============ 彈窗 ============ */
function showModal(html){
  document.getElementById('modalBox').innerHTML=`<span class="close" onclick="closeModal()">關閉 ×</span>${html}`;
  document.getElementById('modal').classList.add('show');
}
function closeModal(){document.getElementById('modal').classList.remove('show')}
document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')closeModal()};
function go(h){location.hash=h;document.getElementById('sidebar').classList.remove('open')}

/* ============ 內聯 SVG 示意圖 ============ */
function svgFor(id){
  const W=560,H=220,bg='var(--line)',fc='var(--accent)',txt='var(--ink)';
  function box(x,y,w,h,label,fill){return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="8" fill="${fill||'var(--panel)'}" stroke="${bg}"/><text x="${x+w/2}" y="${y+h/2+5}" text-anchor="middle" font-size="13" fill="${txt}">${label}</text>`}
  function arrow(x1,y1,x2,y2){return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${fc}" stroke-width="2" marker-end="url(#a)"/>`}
  const defs=`<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="${fc}"/></marker></defs>`;
  const flows={
    flow1:()=>`<svg viewBox="0 0 ${W} ${H}" role="img">${defs}${box(20,90,120,50,'五國照片實驗')}${box(200,40,140,50,'跨文化共識？')}${box(200,140,140,50,'表露的規則')}${box(400,90,140,50,'表情普世共通')}${arrow(140,115,200,65)}${arrow(140,115,200,165)}${arrow(340,65,400,110)}</svg>`,
    flow2:()=>`<svg viewBox="0 0 ${W} ${H}" role="img">${defs}${box(20,90,120,50,'重要事件')}${box(180,90,140,50,'自動評估群\n(毫秒,無意識)')}${box(340,40,180,40,'情緒啟動')}${box(340,140,180,40,'生理+表情+行動')}${arrow(140,115,180,115)}${arrow(320,105,340,60)}${arrow(320,125,340,160)}</svg>`,
    flow3:()=>`<svg viewBox="0 0 ${W} ${H}" role="img">${defs}${box(20,90,140,50,'①辨認誘因')}${box(200,90,150,50,'②可改/難改?')}${box(390,60,150,40,'調整敏感度')}${box(390,130,150,40,'接納/減強度')}${arrow(160,115,200,115)}${arrow(350,105,390,80)}${arrow(350,125,390,150)}</svg>`,
    flow4:()=>`<svg viewBox="0 0 ${W} ${H}" role="img">${defs}${box(20,90,120,50,'察覺信號')}${box(180,40,150,40,'臉/聲音')}${box(180,140,150,40,'身體感覺')}${box(370,90,160,50,'選擇回應而非被駕駛')}${arrow(140,100,180,60)}${arrow(140,120,180,160)}${arrow(330,60,370,105)}${arrow(330,160,370,115)}</svg>`,
    flow5:()=>`<svg viewBox="0 0 ${W} ${H}" role="img">${defs}${box(40,90,160,50,'重要失落')}${box(250,40,150,40,'哀傷(感受)')}${box(250,140,150,40,'悲痛(適應過程)')}${box(440,90,110,50,'隨時間緩解')}${arrow(200,100,250,60)}${arrow(200,120,250,160)}${arrow(400,60,440,105)}${arrow(400,160,440,115)}</svg>`,
    flow6:()=>`<svg viewBox="0 0 ${W} ${H}" role="img">${defs}${box(20,90,150,50,'被阻/被冒犯')}${box(210,90,140,50,'身體準備對抗')}${box(390,90,150,50,'攻擊或克制')}${arrow(170,115,210,115)}${arrow(350,115,390,115)}</svg>`,
    flow7:()=>`<svg viewBox="0 0 ${W} ${H}" role="img">${defs}${box(20,90,120,50,'新異刺激')}${box(180,40,140,40,'驚訝(數秒)')}${box(180,140,140,40,'判斷威脅?')}${box(360,140,170,40,'害怕→準備逃離')}${box(360,40,170,40,'放鬆')}${arrow(140,100,180,60)}${arrow(140,120,180,160)}${arrow(320,60,360,60)}${arrow(320,160,360,160)}</svg>`,
    flow8:()=>`<svg viewBox="0 0 ${W} ${H}" role="img">${defs}${box(20,40,150,40,'污染/不潔')}${box(20,150,150,40,'位階優越感')}${box(220,40,140,40,'嫌惡:排斥/嘔吐')}${box(220,150,140,40,'輕蔑:貶低')}${arrow(170,60,220,60)}${arrow(170,170,220,170)}</svg>`,
    flow9:()=>`<svg viewBox="0 0 ${W} ${H}" role="img">${defs}${box(20,90,150,50,'愉悅事件')}${box(210,40,140,40,'真笑(眼周參與)')}${box(210,150,140,40,'擴展注意/連結')}${arrow(160,100,210,60)}${arrow(160,120,210,170)}</svg>`,
    flow10:()=>`<svg viewBox="0 0 ${W} ${H}" role="img">${defs}${box(160,90,240,50,'了解情緒機制 → 覺察 → 選擇回應方式', 'var(--accent-soft)')}</svg>`,
    flow11:()=>`<svg viewBox="0 0 ${W} ${H}" role="img">${defs}${box(40,90,180,50,'讀前測一次')}${box(270,90,180,50,'讀後再測一次')}${arrow(220,115,270,115)}</svg>`,
  };
  return flows[id]?flows[id]():'<p class="small">（圖略）</p>';
}
