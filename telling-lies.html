<html lang="zh-CN">

<title>說謊：揭穿商業、政治與婚姻中的騙局 — 互動複習</title>
<style>
/* ===== CSS Reset & Variables ===== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f6f0e2;--surface:#fffdf6;--text:#475272;--text2:#8a8598;
  --border:#e4d9bf;--primary:#3a9b88;--primary-light:#e0f0ec;
  --term:#3a9b88;--term-bg:#e0f0ec;
  --name:#7b2cbf;--name-bg:#f0e8f8;
  --exam:#d96a5f;--exam-bg:#fbe4de;
  --correct:#3a9b88;--correct-bg:#e0f0ec;
  --wrong:#d96a5f;--wrong-bg:#fbe4de;
  --accent:#d96a5f;--sidebar-w:280px;
  --radius:12px;--shadow:0 1px 3px rgba(80,60,30,.08);
}
[data-theme="dark"]{
  --bg:#1f1c16;--surface:#2a2620;--text:#e6e0d2;--text2:#a0937a;
  --border:#3f3a2e;--primary:#5cc0a8;--primary-light:#1f2e2a;
  --term:#5cc0a8;--term-bg:#1f2e2a;
  --name:#b48dd9;--name-bg:#2e2638;
  --exam:#e58a7a;--exam-bg:#3a2422;
  --correct:#5cc0a8;--correct-bg:#1f2e2a;
  --wrong:#e58a7a;--wrong-bg:#3a2422;
  --shadow:0 1px 3px rgba(0,0,0,.4);
}
html{font-size:16px;scroll-behavior:smooth}
body{font-family:"Noto Serif TC","Songti TC","PingFang TC","Microsoft JhengHei",serif;background:var(--bg);color:var(--text);line-height:1.7;transition:background .3s,color .3s}
a{color:var(--primary);text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:inherit}
input,select{font-family:inherit;font-size:inherit}

/* ===== Layout ===== */
.app{display:flex;min-height:100vh}
.sidebar{width:var(--sidebar-w);background:var(--surface);border-right:1px solid var(--border);position:fixed;top:0;left:0;height:100vh;overflow-y:auto;z-index:100;transition:transform .3s;padding:16px}
.main{flex:1;margin-left:var(--sidebar-w);padding:24px 32px}
.main>*{max-width:900px;margin-left:auto;margin-right:auto;width:100%}

/* ===== Sidebar ===== */
.sidebar-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.sidebar-header h2{font-size:1rem;color:var(--primary)}
.sidebar-controls{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.sidebar-controls{display:flex;gap:8px;margin-bottom:14px}
.sidebar-controls button{width:44px;height:40px;border:1px solid var(--border);border-radius:8px;font-size:18px;background:var(--bg);display:flex;align-items:center;justify-content:center;color:var(--primary)}
.sidebar-controls button:hover{background:var(--primary-light)}
.sidebar-controls button:hover{background:var(--primary-light)}
.search-box{width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:var(--radius);margin-bottom:16px;background:var(--bg);color:var(--text)}
.nav-list{list-style:none}
.nav-item{padding:8px 10px;border-radius:var(--radius);cursor:pointer;font-size:.88rem;display:flex;align-items:center;justify-content:space-between;gap:8px}
.nav-item:hover{background:var(--primary-light)}
.nav-item.active{background:var(--primary);color:#fff}
.nav-item .pct{font-size:.72rem;opacity:.7;white-space:nowrap}
.nav-section{font-size:.75rem;color:var(--text2);text-transform:uppercase;letter-spacing:.05em;margin:12px 0 4px;padding-left:10px}

/* ===== Top Bar ===== */
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:12px}
.topbar h1{font-size:1.4rem}
.topbar-btns{display:flex;gap:8px}
.topbar-btns button{padding:6px 12px;border:1px solid var(--border);border-radius:var(--radius);font-size:.85rem;background:var(--surface)}
.topbar-btns button:hover{background:var(--primary-light)}
.menu-toggle{display:none}

/* ===== Home / Book Cover ===== */
.home-hero{text-align:center;padding:40px 20px}
.home-hero h1{font-size:1.8rem;margin-bottom:8px}
.home-hero .author{color:var(--text2);margin-bottom:24px}
.home-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:24px 0}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;text-align:center}
.stat-card .num{font-size:1.6rem;font-weight:700;color:var(--primary)}
.stat-card .label{font-size:.78rem;color:var(--text2)}
.chapter-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-top:20px}
.ch-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;cursor:pointer;transition:border-color .2s}
.ch-card:hover{border-color:var(--primary)}
.ch-card h3{font-size:.95rem;margin-bottom:8px}
.ch-card .meta{font-size:.78rem;color:var(--text2)}
.ch-card .bar{height:4px;background:var(--border);border-radius:2px;margin-top:8px;overflow:hidden}
.ch-card .bar-fill{height:100%;background:var(--primary);border-radius:2px;transition:width .3s}

/* ===== Chapter Content ===== */
.chapter-head{margin-bottom:24px}
.chapter-head h2{font-size:1.5rem;margin-bottom:4px}
.chapter-head .sub{color:var(--text2);font-size:.88rem}
.progress-row{display:flex;align-items:center;gap:12px;margin:12px 0}
.progress-row .bar{flex:1;height:6px;background:var(--border);border-radius:3px;overflow:hidden}
.progress-row .bar-fill{height:100%;background:var(--primary)}
.progress-row .pct-text{font-size:.8rem;color:var(--text2)}

.section{margin-bottom:28px}
.section h3{font-size:1.1rem;margin-bottom:12px;padding-bottom:4px;border-bottom:2px solid var(--primary)}
.subsection{margin-bottom:16px}
.sub-head{cursor:pointer;padding:8px 12px;background:var(--primary-light);border-radius:var(--radius);font-weight:600;font-size:.92rem;display:flex;justify-content:space-between;align-items:center}
.sub-body{padding:12px 8px;display:none}
.sub-body.open{display:block}
.sub-body p{margin-bottom:10px;text-indent:2em}

/* ===== Terminology highlighting ===== */
.term{color:var(--term);font-weight:700;cursor:pointer;border-bottom:1px dashed var(--term)}
.pname{color:var(--name);font-weight:700;cursor:pointer;border-bottom:1px dashed var(--name)}

/* ===== Key Points ===== */
.key-points{list-style:none;padding-left:0}
.key-points li{padding:8px 12px;margin-bottom:6px;background:var(--surface);border-left:3px solid var(--primary);border-radius:0 var(--radius) var(--radius) 0;font-size:.92rem}

/* ===== Method Cards ===== */
.method-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:12px;overflow:hidden}
.method-card.done{opacity:.5;text-decoration:line-through}
.method-head{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--primary-light);font-weight:600}
.method-head input[type=checkbox]{width:18px;height:18px;cursor:pointer}
.method-body{padding:12px 14px;font-size:.9rem}
.method-body .formula{background:var(--bg);padding:8px 12px;border-radius:4px;margin:8px 0;font-family:monospace;font-size:.88rem}
.method-body .example{border-top:1px dashed var(--border);margin-top:8px;padding-top:8px;color:var(--text2);font-size:.85rem}

/* ===== Comparison Table ===== */
.cmp-table{width:100%;border-collapse:collapse;font-size:.88rem;margin:12px 0;table-layout:fixed}
.cmp-table th,.cmp-table td{border:1px solid var(--border);padding:8px 10px;text-align:left;vertical-align:top}
.cmp-table th{background:var(--primary-light);font-weight:600}

/* ===== Exam Tip ===== */
.exam-tip{background:var(--exam-bg);border-left:4px solid var(--exam);border-radius:0 var(--radius) var(--radius) 0;padding:12px 16px;margin:12px 0}
.exam-tip h4{color:var(--exam);font-size:.9rem;margin-bottom:6px}
.exam-tip p{font-size:.88rem}

/* ===== Quiz ===== */
.quiz-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:16px;padding:16px}
.quiz-q{font-weight:600;margin-bottom:10px;font-size:.92rem}
.quiz-opts{list-style:none}
.quiz-opt{padding:8px 12px;border:1px solid var(--border);border-radius:var(--radius);margin-bottom:6px;cursor:pointer;font-size:.88rem;transition:background .2s}
.quiz-opt:hover{background:var(--primary-light)}
.quiz-opt.correct{background:var(--correct-bg);border-color:var(--correct);color:var(--correct);font-weight:600}
.quiz-opt.wrong{background:var(--wrong-bg);border-color:var(--wrong);color:var(--wrong)}
.quiz-opt.disabled{pointer-events:none;opacity:.7}
.quiz-feedback{margin-top:8px;font-size:.85rem;padding:8px 12px;border-radius:var(--radius);display:none}
.quiz-feedback.show{display:block}
.quiz-feedback.ok{background:var(--correct-bg);color:var(--correct)}
.quiz-feedback.bad{background:var(--wrong-bg);color:var(--wrong)}
.quiz-actions{display:flex;gap:8px;margin-top:8px;font-size:.8rem}
.quiz-actions button{padding:4px 10px;border:1px solid var(--border);border-radius:4px}

/* ===== Term List (chapter end) ===== */
.term-list{list-style:none}
.term-item{padding:8px 12px;border:1px solid var(--border);border-radius:var(--radius);margin-bottom:6px;font-size:.88rem;display:flex;align-items:flex-start;gap:8px}
.term-item input[type=checkbox]{margin-top:4px}
.term-item .term-en{font-weight:700;color:var(--term)}
.term-item .term-cn{color:var(--text)}
.term-item .term-def{color:var(--text2);font-size:.82rem;margin-top:2px}
.term-item.learned{opacity:.5}
.term-item.learned .term-en{text-decoration:line-through}

/* ===== Modal ===== */
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:200;display:none;align-items:center;justify-content:center;padding:20px}
.modal-overlay.show{display:flex}
.modal{background:var(--surface);border-radius:var(--radius);max-width:500px;width:100%;padding:24px;max-height:80vh;overflow-y:auto}
.modal h3{margin-bottom:12px;color:var(--primary)}
.modal .close-btn{float:right;cursor:pointer;font-size:1.2rem}

/* ===== Wrong Answer Book ===== */
.wrong-item{padding:10px 14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:8px;font-size:.88rem}
.wrong-item .q{font-weight:600;margin-bottom:4px}
.wrong-item .a{color:var(--correct);font-size:.84rem}
.wrong-item .actions{margin-top:6px}
.wrong-item button{padding:3px 8px;font-size:.78rem;border:1px solid var(--border);border-radius:4px;margin-right:6px}

/* ===== Mark Mode ===== */
body.mark-mode .markable{cursor:crosshair}
body.mark-mode .markable:hover{outline:2px dashed var(--accent)}
.highlight{background:var(--accent) !important;color:#000 !important}

/* ===== Mobile ===== */
.menu-toggle{display:none;position:fixed;top:12px;left:12px;z-index:150;padding:8px 12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);font-size:1.1rem}
@media(max-width:900px){
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0)}
  .main{margin-left:0;padding:60px 16px 24px}
  .menu-toggle{display:block}
}

/* ===== Misc ===== */
.empty-msg{text-align:center;color:var(--text2);padding:40px;font-size:.9rem}
.back-top{position:fixed;bottom:20px;right:20px;padding:8px 14px;background:var(--primary);color:#fff;border-radius:var(--radius);cursor:pointer;font-size:.85rem;display:none;z-index:50}
.back-top.show{display:block}
.svg-diagram{width:100%;max-width:500px;margin:12px auto;display:block}
.note-input{width:100%;padding:6px;margin-top:6px;border:1px solid var(--border);border-radius:4px;font-size:.82rem;background:var(--bg);color:var(--text)}
</style>
</head>

<script>
// ===== DATA =====
const BOOK = {
  title: "說謊：揭穿商業、政治與婚姻中的騙局",
  subtitle: "Telling Lies: Clues to Deceit in the Marketplace, Politics, and Marriage",
  author: "Paul Ekman 著 / 鄧伯宸、徐國強 譯",
  pub: "生活·讀書·新知三聯書店 2006"
};

const CHAPTERS = [
{
  id:1, title:"導言", pages:"p15–22",
  keyPoints:[
    "說謊研究起源於臨床實務：精神科醫生擔心住院病人說謊表示「沒事」而出院後自殺",
    "核心問題：即使心緒極度不寧，人們是否還能神色自若地說謊？能否從非口語行為中辨識？",
    "Ekman 從精神病患訪談錄影中發現說謊線索——面部表情普世相同，手勢則因文化而異",
    "張伯倫與希特勒的案例說明：高風險謊言可造成國家級災難，抓謊能力關乎生死存亡"
  ],
  sections:[
    {title:"研究起源", body:"Ekman 最初研究面部表情的跨文化普遍性，被學員問及能否從病人的非口語行為判斷說謊。臨床困境在於：病人說「我沒事」但醫生無法確定他是否在說謊，放他出院可能危及生命。Ekman 調出舊訪談錄影帶，發現許多片段中其實透露著說謊的跡象。"},
    {title:"張伯倫的教訓", body:"1938年張伯倫相信希特勒的「言出必踐」，結果換來第二次世界大戰。這個案例說明：面對老練說謊者（如政治人物），即使是國家領導人也會被騙，而且被騙的代價極為慘重。"}
  ],
  methods:[
    {name:"臨床困境模型", formula:"病人自述「無自殺傾向」 vs 醫生觀察到的危險訊號\n→ 必須判斷：哪些非口語行為可靠？", example:"護士學生實驗：觀看血腥影片卻偽裝平靜，聲調變高、手勢變少、出現聳肩失誤。"}
  ],
  comparisons:[
    {cols:["維度","臨床情境","政治/商業情境"],rows:[
      [" stakes（代價）","病人自殺→生命危險","戰爭/商業損失","高風險"],
      ["說謊者","精神患者","老練政客","長期練習"],
      ["觀察者","醫生","談判者","資訊不對稱"]
    ]}
  ],
  examTips:[
    "本書核心問題不是「謊言長什麼樣」，而是「情緒如何洩露」——謊言本身沒有外在表徵，只有破綻和線索"
  ],
  terms:[
    {en:"Leakage", cn:"破綻", def:"說謊者無意間洩露真實情緒的行為"},
    {en:"Deception Clue", cn:"說謊線索", def:"不洩露實情，但暴露正在說謊的行為"},
    {en:"Nonverbal Behavior", cn:"非口語行為", def:"面部表情、手勢、姿態、聲調等語言之外的訊號"}
  ],
  quiz:[
    {q:"Ekman 開始研究說謊的最初動機是什麼？",opts:["政府委託的間諜研究","臨床醫生擔心病人說謊表示「沒事」而出院後自殺","為法庭做測謊鑑定","純粹學術好奇"],a:1,exp:"Ekman 在指導治療醫師時被問及能否從病人非口語行為判斷說謊，這觸發了研究。"},
    {q:"本書的核心研究物件是什麼？",opts:["謊言的法律定義","說謊者的情緒洩露與行為線索","測謊儀的電路原理","政治宣傳的效果"],a:1,exp:"本書關注的是說謊者無法控制的情緒訊號，而非謊言本身的內容。"},
    {q:"張伯倫與希特勒案例的主要教訓是什麼？",opts:["希特勒是優秀演員","即使是國家領導人也會被老練說謊者欺騙，代價慘重","英國人不瞭解德國文化","政治家不應出國訪問"],a:1,exp:"張伯倫相信希特勒的承諾，結果換來戰爭。這說明面對高風險謊言，抓謊能力至關重要。"},
    {q:"面部表情與手勢的跨文化差異是什麼？",opts:["兩者都因文化而異","面部表情普世相同，手勢因文化而異","手勢普世相同，面部表情因文化而異","兩者都普世相同"],a:1,exp:"Ekman 的跨文化研究發現面部表情具有普遍性，但手勢/emblems 因文化不同。"},
    {q:"為什麼早期的訪談錄影帶對研究有用？",opts:["畫面質量極佳","原本用於診斷病情，但事後發現其中包含說謊案例","都是專業演員演出","錄製時長正好"],a:1,exp:"這些錄影帶本來用於診斷精神疾病型別，Ekman 轉用它們來尋找說謊線索。"},
    {q:"說謊研究與一般溝通研究的根本區別是？",opts:["說謊研究更難","研究物件是否有意隱瞞資訊","說謊者都更聰明","溝通不需要觀察"],a:1,exp:"關鍵區別在於說謊者有目的地誤導，這使得行為線索的解讀更加複雜。"}
  ]
},
{
  id:2, title:"謊言、破綻與說謊線索", pages:"p23–40",
  keyPoints:[
    "說謊定義：存心誤導別人的有意行為，事先未透露目的",
    "兩種說謊方式：隱瞞真相（concealment）vs 捏造事實（falsification）",
    "破綻（leakage）洩露真實情緒；說謊線索（deception clue）只暴露在說謊",
    "人們不願承認「說謊」，常用「隱瞞」「誤導」代替——尼克松只承認隱瞞真相"
  ],
  sections:[
    {title:"說謊的定義", body:"說謊是存心誤導別人的有意行為，事先未透露其目的，且對方沒有被要求協助進行誤導。無心提供錯誤資訊不算說謊（如妄想症患者自稱是歷史人物）。"},
    {title:"隱瞞 vs 捏造", body:"隱瞞是不讓對方知道真實資訊；捏造是把虛假資訊當作真實資訊說出來。尼克松只承認自己「隱瞞真相」，拒絕承認「說謊」——這反映了人們對 lie 一詞的道德反感。"},
    {title:"破綻與說謊線索的區別", body:"破綻（leakage）：說謊者無意間洩露了真實情緒或資訊。說謊線索（deception clue）：行為本身不洩露實情，但暴露了「這個人在說謊」這件事。前者洩露「是什麼」，後者洩露「有沒有」。"}
  ],
  methods:[

{
  id:5, title:"說謊的表情線索", pages:"p113–145",
  keyPoints:[
    "面部同時包含兩種表情：想表現的（假）和想隱藏的（真）",
    "真表情是無意識的（錐體外神經系統控制），假表情是有意識的（錐體神經系統控制）",
    "微表情：不到1/5秒的真實情緒洩露，轉瞬即逝",
    "不隨意肌：前額、眼周等部位的肌肉無法刻意控制，是測謊的黃金線索"
  ],
  sections:[
    {title:"真表情 vs 假表情", body:"真表情是無意識的面部動作，未經思索或刻意做作；假表情是有意識控制的面部動作，以阻止真實情緒洩露。研究大腦不同部位受損的患者發現：有意識表情由錐體神經系統控制，無意識表情由錐體外神經系統控制——這是兩個不同的腦回路。"},
    {title:"微表情", body:"微表情（microexpression）是完整情緒性表情壓縮到不到1/5秒，快到難以察覺。Ekman 在精神患者瑪麗的訪談錄影中首次發現：她表面微笑，但慢放時能看到臉上掠過極度憂鬱的神情。"},
    {title:"不隨意肌", body:"面部某些肌肉無法刻意控制：①前額內側角（悲傷/痛苦時揚起）；②眼輪匝肌（Duchenne 笑時眼周皺紋，假笑做不到）；③眉毛和眼皮的特定組合。不到15%的人能隨意做出悲傷表情的額頭動作。"},
    {title:"假笑的識別", body:"Duchenne 笑（真笑）包含眼周肌肉收縮（眼角皺紋）；假笑只動嘴部。假笑不對稱、出現和消失都太突然、持續時間過長。"}
  ],

// ===== STATE =====
let state = {
  view: 'home',
  chapterId: null,
  theme: localStorage.getItem('tell_lies_theme') || 'light',
  marked: {},       // highlighted paragraphs
  learnedCards: JSON.parse(localStorage.getItem('tell_lies_cards') || '{}'),
  learnedTerms: JSON.parse(localStorage.getItem('tell_lies_terms') || '{}'),
  quizResults: JSON.parse(localStorage.getItem('tell_lies_quiz') || '{}'),
  wrongBook: JSON.parse(localStorage.getItem('tell_lies_wrong') || '[]'),
  markedMode: false,
  notes: JSON.parse(localStorage.getItem('tell_lies_notes') || '{}')
};

function saveState() {
  localStorage.setItem('tell_lies_cards', JSON.stringify(state.learnedCards));
  localStorage.setItem('tell_lies_terms', JSON.stringify(state.learnedTerms));
  localStorage.setItem('tell_lies_quiz', JSON.stringify(state.quizResults));
  localStorage.setItem('tell_lies_wrong', JSON.stringify(state.wrongBook));
  localStorage.setItem('tell_lies_notes', JSON.stringify(state.notes));
  localStorage.setItem('tell_lies_theme', state.theme);
}

// ===== ROUTING =====
function showHome() {
  state.view = 'home';
  state.chapterId = null;
  render();
}
function showChapter(id) {
  state.view = 'chapter';
  state.chapterId = id;
  render();
}
function showWrongBook() { state.view = 'wrong'; render(); }
function showTerms() { state.view = 'terms'; render(); }

function toggleTheme() {
  state.theme = state.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', state.theme);
  saveState();
}

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
}

// ===== RENDERING =====
function render() {
  document.documentElement.setAttribute('data-theme', state.theme);
  renderSidebar();
  const main = document.getElementById('main');
  if (state.view === 'home') main.innerHTML = renderHome();
  else if (state.view === 'chapter') main.innerHTML = renderChapter(state.chapterId);
  else if (state.view === 'wrong') main.innerHTML = renderWrongBook();
  else if (state.view === 'terms') main.innerHTML = renderTerms();
  window.scrollTo(0, 0);
}

function renderSidebar() {
  const nav = document.getElementById('navList');
  let html = '<li class="nav-section">章節</li>';
  CHAPTERS.forEach(ch => {
    const pct = getChapterProgress(ch.id);
    html += `<li class="nav-item ${state.chapterId===ch.id&&state.view==='chapter'?'active':''}" onclick="showChapter(${ch.id})">
      <span>${ch.id<90?'第'+ch.id+'章':''} ${ch.title}</span>
      <span class="pct">${pct}%</span></li>`;
  });
  html += '<li class="nav-section">工具</li>';
  html += `<li class="nav-item" onclick="showWrongBook()"><span>錯題本</span><span class="pct">${state.wrongBook.length}</span></li>`;
  html += `<li class="nav-item" onclick="showTerms()"><span>全書術語表</span></li>`;
  html += `<li class="nav-item" onclick="toggleMarkMode()"><span id="markBtn">${state.markedMode?'關閉畫記':'開啟畫記'}</span></li>`;
  nav.innerHTML = html;
  document.body.classList.toggle('mark-mode', state.markedMode);
}

function getChapterProgress(cid) {
  const ch = CHAPTERS.find(c => c.id === cid);
  if (!ch) return 0;
  const quiz = ch.quiz || [], methods = ch.methods || [], terms = ch.terms || [];
  let total = quiz.length + methods.length + terms.length;
  let done = 0;
  quiz.forEach((q, qi) => { if (state.quizResults[cid+'_'+qi]) done++; });
  methods.forEach((m, mi) => { if (state.learnedCards[cid+'_'+mi]) done++; });
  terms.forEach((t, ti) => { if (state.learnedTerms[cid+'_'+ti]) done++; });
  return total > 0 ? Math.round(done/total*100) : 0;
}

function renderHome() {
  let totalQuiz = 0, doneQuiz = 0;
  CHAPTERS.forEach(ch => {
    const quiz = ch.quiz || [];
    totalQuiz += quiz.length;
    quiz.forEach((q, qi) => { if (state.quizResults[ch.id+'_'+qi]) doneQuiz++; });
  });
  let totalTerms = 0, doneTerms = 0;
  CHAPTERS.forEach(ch => {
    const terms = ch.terms || [];
    totalTerms += terms.length;
    terms.forEach((t, ti) => { if (state.learnedTerms[ch.id+'_'+ti]) doneTerms++; });
  });
  let totalCards = 0, doneCards = 0;
  CHAPTERS.forEach(ch => {
    const methods = ch.methods || [];
    totalCards += methods.length;
    methods.forEach((m, mi) => { if (state.learnedCards[ch.id+'_'+mi]) doneCards++; });
  });

  let cards = CHAPTERS.map(ch => {
    const pct = getChapterProgress(ch.id);
    const qn = (ch.quiz||[]).length;
    const tn = (ch.terms||[]).length;
    return `<div class="ch-card" onclick="showChapter(${ch.id})">
      <h3>${ch.id<90?'第'+ch.id+'章 · ':''}${ch.title}</h3>
      <div class="meta">${ch.pages} · ${qn}題 · ${tn}術語</div>
      <div class="bar"><div class="bar-fill" style="width:${pct}%"></div></div>
      <div class="meta" style="margin-top:4px">${pct}% 完成</div>
    </div>`;
  }).join('');

  return `<div class="home-hero">
    <h1>${BOOK.title}</h1>
    <div class="author">${BOOK.subtitle}<br>${BOOK.author} · ${BOOK.pub}</div>
    <div class="home-stats">
      <div class="stat-card"><div class="num">${CHAPTERS.length}</div><div class="label">章節</div></div>
      <div class="stat-card"><div class="num">${doneQuiz}/${totalQuiz}</div><div class="label">例題已做</div></div>
      <div class="stat-card"><div class="num">${doneCards}/${totalCards}</div><div class="label">方法卡已學</div></div>
      <div class="stat-card"><div class="num">${doneTerms}/${totalTerms}</div><div class="label">術語已掌握</div></div>
      <div class="stat-card"><div class="num">${state.wrongBook.length}</div><div class="label">錯題本</div></div>
    </div>
  </div>
  <h2 style="margin:24px 0 12px">章節列表</h2>
  <div class="chapter-grid">${cards}</div>`;
}

function renderChapter(cid) {
  const ch = CHAPTERS.find(c => c.id === cid);
  if (!ch) return '<div class="empty-msg">章節不存在</div>';
  const pct = getChapterProgress(cid);
  const kp = ch.keyPoints || [], secs = ch.sections || [], exTips = ch.examTips || [];
  const quiz = ch.quiz || [], terms = ch.terms || [];

  let html = `<div class="chapter-head">
    <h2>${ch.id<90?'第'+ch.id+'章 · ':''}${ch.title}</h2>
    <div class="sub">${ch.pages}</div>
    <div class="progress-row">
      <div class="bar"><div class="bar-fill" style="width:${pct}%"></div></div>
      <span class="pct-text">${pct}%</span>
    </div>
  </div>`;

  // Key points
  html += `<div class="section"><h3>本章重點</h3><ul class="key-points">`;
  kp.forEach(kp => html += `<li>${highlight(kp)}</li>`);
  html += `</ul></div>`;

  // Subsections
  html += `<div class="section"><h3>課文</h3>`;
  secs.forEach((sec, si) => {
    html += `<div class="subsection">
      <div class="sub-head" onclick="this.nextElementSibling.classList.toggle('open')">
        <span>${sec.title}</span><span>+</span>
      </div>
      <div class="sub-body markable">${highlight(sec.body)}</div>
    </div>`;
  });
  html += `</div>`;

  // Method cards
  const methods = ch.methods || [];
  if (methods.length) {
    html += `<div class="section"><h3>方法卡</h3>`;
    methods.forEach((m, mi) => {
      const key = cid+'_'+mi;
      const learned = state.learnedCards[key];
      html += `<div class="method-card ${learned?'done':''}">
        <div class="method-head">
          <input type="checkbox" ${learned?'checked':''} onchange="toggleCard('${key}')">
          <span>${m.name}</span>
        </div>
        <div class="method-body">
          <div class="formula">${m.formula.replace(/\n/g,'<br>')}</div>
          <div class="example"><strong>例子：</strong>${m.example}</div>
        </div>
      </div>`;
    });
    html += `</div>`;
  }

  // Comparison tables
  const comps = ch.comparisons || [];
  if (comps.length) {
    html += `<div class="section"><h3>比較表</h3>`;
    comps.forEach(tbl => {
      html += `<table class="cmp-table"><colgroup>`;
      const ncols = tbl.cols.length;
      tbl.cols.forEach((c, i) => {
        const w = i === 0 ? '25%' : (75/(ncols-1))+'%';
        html += `<col style="width:${w}">`;
      });
      html += `</colgroup><thead><tr>`;
      tbl.cols.forEach(c => html += `<th>${c}</th>`);
      html += `</tr></thead><tbody>`;
      tbl.rows.forEach(row => {
        html += `<tr>`;
        row.forEach(cell => html += `<td>${cell}</td>`);
        html += `</tr>`;
      });
      html += `</tbody></table>`;
    });
    html += `</div>`;
  }

  // Exam tips
  if (exTips.length) {
    html += `<div class="section"><h3>考試重點</h3>`;
    exTips.forEach(tip => {
      html += `<div class="exam-tip"><h4>注意</h4><p>${tip}</p></div>`;
    });
    html += `</div>`;
  }

  // Quiz
  html += `<div class="section"><h3>例題（${quiz.filter((q,qi)=>state.quizResults[cid+'_'+qi]).length}/${quiz.length} 已做）</h3>`;
  quiz.forEach((q, qi) => {
    const key = cid+'_'+qi;
    const result = state.quizResults[key];
    html += `<div class="quiz-item" id="q_${key}">
      <div class="quiz-q">${qi+1}. ${q.q}</div>
      <ul class="quiz-opts">`;
    q.opts.forEach((opt, oi) => {
      let cls = 'quiz-opt';
      if (result) {
        cls += ' disabled';
        if (oi === q.a) cls += ' correct';
        if (result.wrong && oi === result.picked) cls += ' wrong';
      }
      html += `<li class="${cls}" onclick="answerQuiz('${key}',${qi},${oi})">${opt}</li>`;
    });
    html += `</ul>
      <div class="quiz-feedback ${result?'show':''} ${result?(result.wrong?'bad':'ok'):''}">
        ${result ? (result.wrong ? '答錯了。'+q.exp : '答對了！'+q.exp) : ''}
      </div>
      <div class="quiz-actions">
        <button onclick="resetQuiz('${key}')">重做</button>
        <button onclick="toggleStar('${key}')">${result&&result.starred?'★ 已收藏':'☆ 收藏'}</button>
      </div>
    </div>`;
  });
  html += `</div>`;

  // Term list
  html += `<div class="section"><h3>本章術語</h3><ul class="term-list">`;
  terms.forEach((t, ti) => {
    const key = cid+'_'+ti;
    const learned = state.learnedTerms[key];
    const note = state.notes[key] || '';
    html += `<li class="term-item ${learned?'learned':''}">
      <input type="checkbox" ${learned?'checked':''} onchange="toggleTerm('${key}')">
      <div>
        <span class="term-en">${t.en}</span> <span class="term-cn">${t.cn}</span>
        <div class="term-def">${t.def}</div>
        <input class="note-input" placeholder="寫筆記..." value="${note}" oninput="saveNote('${key}',this.value)">
      </div>
    </li>`;
  });
  html += `</ul></div>`;

  return html;
}

function renderWrongBook() {
  let html = `<div class="chapter-head"><h2>錯題本</h2>
    <div class="sub">共 ${state.wrongBook.length} 道錯題</div></div>`;
  if (!state.wrongBook.length) {
    html += '<div class="empty-msg">太棒了！還沒有錯題記錄。去做題吧。</div>';
  } else {
    state.wrongBook.forEach((item, idx) => {
      const ch = CHAPTERS.find(c => c.id === item.chapterId);
      const q = ch.quiz[item.qIndex];
      html += `<div class="wrong-item">
        <div class="q">${idx+1}. [${ch.title}] ${q.q}</div>
        <div class="a">正確答案：${q.opts[q.a]}</div>
        <div class="a" style="color:var(--text2)">你選了：${q.opts[item.picked]}</div>
        <div class="actions">
          <button onclick="markCorrected(${idx})">已訂正</button>
          <button onclick="goQuiz('${item.chapterId}_${item.qIndex}')">回去看題</button>
        </div>
      </div>`;
    });
  }
  return html;
}

function renderTerms() {
  let html = `<div class="chapter-head"><h2>全書術語表</h2>
    <div class="sub">點選術語可檢視詳情，打勾表示已掌握</div></div>`;
  CHAPTERS.forEach(ch => {
    const chTerms = ch.terms || [];
    const learned = chTerms.filter((t,ti)=>state.learnedTerms[ch.id+'_'+ti]).length;
    html += `<h3 style="margin:16px 0 8px;color:var(--primary)">${ch.id<90?'第'+ch.id+'章':''} ${ch.title}（${learned}/${chTerms.length}）</h3><ul class="term-list">`;
    chTerms.forEach((t, ti) => {
      const key = ch.id+'_'+ti;
      const learned = state.learnedTerms[key];
      html += `<li class="term-item ${learned?'learned':''}">
        <input type="checkbox" ${learned?'checked':''} onchange="toggleTerm('${key}')">
        <div>
          <span class="term-en">${t.en}</span> <span class="term-cn">${t.cn}</span>
          <div class="term-def">${t.def}</div>
        </div>
      </li>`;
    });
    html += `</ul>`;
  });
  html += `<div style="margin-top:20px;display:flex;gap:8px">
    <button onclick="exportJSON()" style="padding:8px 16px;border:1px solid var(--border);border-radius:8px">匯出進度 JSON</button>
    <button onclick="document.getElementById('importFile').click()" style="padding:8px 16px;border:1px solid var(--border);border-radius:8px">匯入進度</button>
    <input type="file" id="importFile" accept=".json" style="display:none" onchange="importJSON(event)">
  </div>`;
  return html;
}

// ===== INTERACTIONS =====
function highlight(text) {
  // Highlight terms (green) and proper nouns (purple)
  let out = text;
  CHAPTERS.flatMap(c=>c.terms).forEach(t => {
    out = out.split(t.cn).join(`<span class="term" onclick="showTermCard('${t.en}','${t.cn}','${t.def}')">${t.cn}</span>`);
  });
  return out;
}

function showTermCard(en, cn, def) {
  document.getElementById('modalContent').innerHTML = `
    <span class="close-btn" onclick="closeModal()">&times;</span>
    <h3>${en} <span style="color:var(--term)">${cn}</span></h3>
    <p>${def}</p>`;
  document.getElementById('modalOverlay').classList.add('show');
}
function closeModal(e) {
  if (!e || e.target === document.getElementById('modalOverlay')) {
    document.getElementById('modalOverlay').classList.remove('show');
  }
}

function toggleCard(key) {
  state.learnedCards[key] = !state.learnedCards[key];
  saveState(); render();
}
function toggleTerm(key) {
  state.learnedTerms[key] = !state.learnedTerms[key];
  saveState(); render();
}
function saveNote(key, val) {
  state.notes[key] = val;
  saveState();
}

function answerQuiz(key, qi, oi) {
  const [cid, qidx] = key.split('_');
  const ch = CHAPTERS.find(c => c.id == cid);
  const q = ch.quiz[qi];
  if (state.quizResults[key]) return; // already answered
  const correct = oi === q.a;
  state.quizResults[key] = { picked: oi, wrong: !correct, starred: false };
  if (!correct) {
    state.wrongBook.push({ chapterId: parseInt(cid), qIndex: qi, picked: oi });
  }
  saveState(); render();
}
function resetQuiz(key) {
  delete state.quizResults[key];
  // Remove from wrong book
  state.wrongBook = state.wrongBook.filter(wb => wb.chapterId+'_'+wb.qIndex !== key);
  saveState(); render();
}
function toggleStar(key) {
  if (state.quizResults[key]) {
    state.quizResults[key].starred = !state.quizResults[key].starred;
    saveState(); render();
  }
}
function markCorrected(idx) {
  state.wrongBook.splice(idx, 1);
  saveState(); render();
}
function goQuiz(key) {
  const [cid, qidx] = key.split('_');
  showChapter(parseInt(cid));
  setTimeout(() => {
    const el = document.getElementById('q_'+key);
    if (el) el.scrollIntoView({behavior:'smooth', block:'center'});
  }, 100);
}

function toggleMarkMode() {
  state.markedMode = !state.markedMode;
  render();
}

function doSearch(q) {
  q = q.trim().toLowerCase();
  if (!q) return;
  const results = [];
  CHAPTERS.forEach(ch => {
    // Search in key points, sections, terms, quiz
    kp.forEach(kp => { if (kp.toLowerCase().includes(q)) results.push({type:'重點', ch:ch.title, text:kp, id:ch.id}); });
    terms.forEach(t => { if (t.cn.toLowerCase().includes(q) || t.en.toLowerCase().includes(q)) results.push({type:'術語', ch:ch.title, text:t.en+' '+t.cn, id:ch.id}); });
    quiz.forEach((qz, qi) => { if (qz.q.toLowerCase().includes(q)) results.push({type:'例題', ch:ch.title, text:qz.q, id:ch.id}); });
  });
  if (!results.length) return;
  let html = `<div class="modal-overlay show" onclick="closeModal(event)">
    <div class="modal"><span class="close-btn" onclick="closeModal()">&times;</span>
    <h3>搜尋結果（${results.length}）</h3>`;
  results.slice(0, 20).forEach(r => {
    html += `<div style="padding:8px;border-bottom:1px solid var(--border);cursor:pointer" onclick="closeModal();showChapter(${r.id})">
      <small style="color:var(--text2)">[${r.type}] ${r.ch}</small><br>${r.text.substring(0,80)}
    </div>`;
  });
  html += `</div></div>`;
  document.getElementById('modalOverlay').outerHTML = html;
}

function exportJSON() {
  const data = { cards: state.learnedCards, terms: state.learnedTerms, quiz: state.quizResults, wrong: state.wrongBook, notes: state.notes };
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'tell_lies_progress.json';
  a.click();
}
function importJSON(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function() {
    try {
      const data = JSON.parse(reader.result);
      if (data.cards) state.learnedCards = data.cards;
      if (data.terms) state.learnedTerms = data.terms;
      if (data.quiz) state.quizResults = data.quiz;
      if (data.wrong) state.wrongBook = data.wrong;
      if (data.notes) state.notes = data.notes;
      saveState(); render();
      alert('匯入成功');
    } catch(err) { alert('匯入失敗：檔案格式錯誤'); }
  };
  reader.readAsText(file);
}

// Back to top
window.addEventListener('scroll', () => {
  document.getElementById('backTop').classList.toggle('show', window.scrollY > 400);
});

// Mark mode click handler (delegated)
document.addEventListener('click', (e) => {
  if (state.markedMode && e.target.classList.contains('markable')) {
    e.target.classList.toggle('highlight');
  }
});

// Init
render();
</script>
</body>
</html>
