<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>識謊・讀心 — Paul Ekman 著作互動複習書架</title>
<style>
:root{
  --bg:#f7f6f1;--card:#ffffff;--panel:#efece4;--line:#ddd8cc;
  --ink:#2b2b2b;--muted:#7a7a7a;--accent:#2e7d5b;--accent-soft:#e6f2ec;
  --shadow:0 2px 10px rgba(0,0,0,.06);
}
*{box-sizing:border-box}
body{margin:0;font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;
  background:var(--bg);color:var(--ink);line-height:1.7}
.wrap{max-width:1000px;margin:0 auto;padding:40px 24px 80px}
.hero{display:flex;gap:24px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.hero img.portrait{width:110px;height:132px;object-fit:cover;border-radius:12px;border:1px solid var(--line)}
.hero h1{font-size:2rem;margin:0 0 4px}
.hero .sub{color:var(--muted);margin:0}
.hero .who{margin-top:6px;font-size:.95rem}
.tagline{border-left:4px solid var(--accent);background:var(--accent-soft);
  padding:14px 18px;border-radius:0 10px 10px 0;margin:24px 0}
h2.sect{font-size:1.2rem;margin:36px 0 14px;color:var(--accent)}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px}
.book-card{background:var(--card);border:1px solid var(--line);border-radius:14px;
  overflow:hidden;box-shadow:var(--shadow);text-decoration:none;color:var(--ink);
  display:flex;flex-direction:column;transition:transform .15s,box-shadow .15s}
.book-card:hover{transform:translateY(-3px);box-shadow:0 6px 18px rgba(0,0,0,.1)}
.book-card .cover{width:100%;height:220px;object-fit:cover;background:var(--panel);display:block}
.book-card .body{padding:16px 18px 18px;flex:1;display:flex;flex-direction:column}
.book-card h3{margin:0 0 2px;font-size:1.08rem}
.book-card .en{color:var(--muted);font-size:.85rem;margin-bottom:8px}
.book-card p{margin:0 0 12px;font-size:.92rem;color:#444;flex:1}
.book-card .go{display:inline-block;align-self:flex-start;background:var(--accent);color:#fff;
  padding:8px 16px;border-radius:8px;font-size:.9rem}
.meta{color:var(--muted);font-size:.82rem;margin-bottom:10px}
footer{margin-top:48px;color:var(--muted);font-size:.82rem;text-align:center}
@media(max-width:600px){.hero img.portrait{width:80px;height:96px}.hero h1{font-size:1.5rem}}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <img class="portrait" src="images/ekman.jpg" alt="Paul Ekman">
    <div>
      <h1>識謊・讀心</h1>
      <p class="sub">Paul Ekman 著作互動複習書架</p>
      <p class="who">Paul Ekman（1934–2025）｜ 情緒與臉部表情、識謊研究先驅</p>
    </div>
  </div>

  <div class="tagline">
    這是一個自架的互動讀書站：把 Paul Ekman 解讀情緒與辨識謊言的著作，
    做成可答題、可記術語、進度自動儲存的複習頁。點書卡進入；日後新增書籍，
    只需在頁面原始碼的 <code>BOOKS</code> 清單加一行。
  </div>

  <h2 class="sect">書架</h2>
  <div class="shelf" id="shelf"></div>

  <footer>
    本書架為個人讀書筆記用途 ｜ 進度與畫記存於各書頁自己的瀏覽器 ｜ 圖片版權歸原作者／出版社
  </footer>
</div>

<script>
// === 新增書籍：在這裡加一筆即可 ===
const BOOKS=[
  {
    title:"心理學家的面相術：解讀情緒的密碼",
    en:"Emotions Revealed",
    href:"face-reading.html",
    cover:"images/cover-emotions.jpg",
    desc:"情緒如何在臉上顯露、跨文化共通的基本情緒、Duchenne 微笑、FACS 與微表情——本書的核心。",
    meta:"9 章 + 結論 + 附錄表情測驗"
  },
  {
    title:"說謊：揭穿商業、政治與婚姻中的騙局",
    en:"Telling Lies",
    href:"telling-lies.html",
    cover:"images/cover-tellinglies.jpg",
    desc:"如何從臉部表情、聲音、話語與肢體線索辨識謊言；情緒洩漏與說謊線索的系統整理。",
    meta:"依說謊線索分章 ｜ 含例題與術語表"
  }
  // 下一本：{ title:"", en:"", href:"xxx.html", cover:"images/xxx.jpg", desc:"", meta:"" }
];

document.getElementById('shelf').innerHTML=BOOKS.map(b=>`
  <a class="book-card" href="${b.href}">
    <img class="cover" src="${b.cover}" alt="${b.title} 封面" onerror="this.style.background='var(--panel)';this.removeAttribute('src')">
    <div class="body">
      <h3>${b.title}</h3>
      <div class="en">${b.en}</div>
      <div class="meta">${b.meta}</div>
      <p>${b.desc}</p>
      <span class="go">進入此書 →</span>
    </div>
  </a>`).join('');
</script>
</body>
</html>
