<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>識謊・讀心 — Paul Ekman 著作互動複習書架</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+TC:wght@400;600;700;900&display=swap">
<style>
:root{
  --paper:#f6f0e2; --panel:#f1e9d5; --card:#fffdf6; --ink:#475272; --muted:#8a8598;
  --line:#e4d9bf; --accent:#d96a5f; --accent-soft:#fbe4de;
  --teal:#3a9b88; --teal-soft:#e0f0ec;
  --name:#7b2cbf; --name-soft:#f0e8f8;
  --shadow:0 2px 10px rgba(80,60,30,.1);
}
[data-theme="dark"]{
  --paper:#1f1c16; --panel:#241f18; --card:#2a2620; --ink:#e6e0d2; --muted:#a0937a;
  --line:#3f3a2e; --accent:#e08a7a; --accent-soft:#3a2622;
  --teal:#5cc0a8; --teal-soft:#1f2e2a;
  --name:#b49ae0; --name-soft:#2d2140;
  --shadow:0 2px 10px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Serif TC","Songti TC","PingFang TC","Microsoft JhengHei",serif;
  background:var(--paper);color:var(--ink);line-height:1.8}
.wrap{max-width:1000px;margin:0 auto;padding:40px 24px 80px}
.topbar{display:flex;justify-content:flex-end;margin-bottom:8px}
.theme-btn{background:var(--card);border:1px solid var(--line);color:var(--teal);
  border-radius:12px;padding:6px 14px;font-size:.85rem;font-family:inherit;cursor:pointer}
.theme-btn:hover{background:var(--teal-soft)}
.hero{display:flex;gap:24px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.hero img.portrait{width:110px;height:132px;object-fit:cover;border-radius:12px;border:1px solid var(--line)}
.hero h1{font-size:2rem;margin:0 0 4px;color:var(--accent)}
.hero .sub{color:var(--muted);margin:0}
.hero .who{margin-top:6px;font-size:.95rem}
.hero .who .nm{color:var(--name);font-weight:700}
.tagline{border-left:8px solid var(--teal);background:var(--card);
  padding:14px 18px;border-radius:12px;margin:24px 0;box-shadow:var(--shadow)}
h2.sect{font-size:1.2rem;margin:36px 0 14px;color:var(--accent);
  border-left:8px solid var(--teal);padding-left:12px}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px}
.book-card{background:var(--card);border:1px solid var(--line);border-radius:12px;
  overflow:hidden;box-shadow:var(--shadow);text-decoration:none;color:var(--ink);
  display:flex;flex-direction:column;transition:transform .15s,box-shadow .15s}
.book-card:hover{transform:translateY(-3px);box-shadow:0 6px 18px rgba(0,0,0,.1)}
.book-card .cover{width:100%;height:220px;object-fit:cover;background:var(--panel);display:block}
.book-card .body{padding:16px 18px 18px;flex:1;display:flex;flex-direction:column}
.book-card h3{margin:0 0 2px;font-size:1.08rem;color:var(--accent)}
.book-card .en{color:var(--muted);font-size:.85rem;margin-bottom:8px}
.book-card p{margin:0 0 12px;font-size:.92rem;flex:1}
.book-card .go{display:inline-block;align-self:flex-start;background:var(--teal);color:#fff;
  padding:8px 16px;border-radius:12px;font-size:.9rem}
.meta{color:var(--muted);font-size:.82rem;margin-bottom:10px}
footer{margin-top:48px;color:var(--muted);font-size:.82rem;text-align:center}
@media(max-width:600px){.hero img.portrait{width:80px;height:96px}.hero h1{font-size:1.5rem}}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar"><button class="theme-btn" id="darkBtn" onclick="toggleDark()">深色模式</button></div>
  <div class="hero">
    <img class="portrait" src="images/ekman.jpg" alt="Paul Ekman">
    <div>
      <h1>識謊・讀心</h1>
      <p class="sub">Paul Ekman 著作互動複習書架</p>
      <p class="who"><span class="nm">Paul Ekman</span>（1934–2025）｜ 情緒與臉部表情、識謊研究先驅</p>
    </div>
  </div>

  <div class="tagline">
    這是一個自架的互動讀書站：把 <span class="nm">Paul Ekman</span> 解讀情緒與辨識謊言的著作，
    做成可答題、可記術語、進度自動儲存的複習頁。點書卡進入；日後新增書籍，
    只需在頁面原始碼的 <code>BOOKS</code> 清單加一行。
  </div>

  <h2 class="sect">書架</h2>
  <div class="shelf" id="shelf"></div>

  <footer>
    本書架為個人讀書筆記用途 ｜ 進度與畫記存於各書頁自己的瀏覽器 ｜ 圖片版權歸原作者／出版社
  </footer>
</div>

<script>
// === 新增書籍：在這裡加一筆即可 ===
const BOOKS=[
  {
    title:"心理學家的面相術：解讀情緒的密碼",
    en:"Emotions Revealed",
    href:"face-reading.html",
    cover:"images/cover-emotions.jpg",
    desc:"情緒如何在臉上顯露、跨文化共通的基本情緒、Duchenne 微笑、FACS 與微表情——本書的核心。",
    meta:"9 章 + 結論 + 附錄表情測驗"
  },
  {
    title:"說謊：揭穿商業、政治與婚姻中的騙局",
    en:"Telling Lies",
    href:"telling-lies.html",
    cover:"images/cover-tellinglies.jpg",
    desc:"如何從臉部表情、聲音、話語與肢體線索辨識謊言；情緒洩漏與說謊線索的系統整理。",
    meta:"依說謊線索分章 ｜ 含例題與術語表"
  },
  {
    title:"Facial Action Coding System",
    en:"The Manual (Paul Ekman, W. Friesen, J. Hager)",
    href:"facs.html",
    cover:"images/cover-facs.jpg",
    desc:"表情編碼系統字典式全覆蓋：133 個動作單元／組合項目，含肌肉基礎、外觀變化、強度分級與 591 張原書照片。",
    meta:"11 章全覆蓋 ｜ 110 題測驗（含看圖題）｜ 英文原文＋繁中摘要"
  }
  // 下一本：{ title:"", en:"", href:"xxx.html", cover:"images/xxx.jpg", desc:"", meta:"" }
];

document.getElementById('shelf').innerHTML=BOOKS.map(b=>`
  <a class="book-card" href="${b.href}">
    <img class="cover" src="${b.cover}" alt="${b.title} 封面" onerror="this.style.background='var(--panel)';this.removeAttribute('src')">
    <div class="body">
      <h3>${b.title}</h3>
      <div class="en">${b.en}</div>
      <div class="meta">${b.meta}</div>
      <p>${b.desc}</p>
      <span class="go">進入此書 →</span>
    </div>
  </a>`).join('');

// 深色模式（與子分頁同款：暖棕黑紙感）
const S={dark:localStorage.getItem('shelf-dark')==='1'};
function applyTheme(){
  document.documentElement.setAttribute('data-theme',S.dark?'dark':'light');
  document.getElementById('darkBtn').textContent=S.dark?'☾ 淺色模式':'☾ 深色模式';
}
function toggleDark(){S.dark=!S.dark;localStorage.setItem('shelf-dark',S.dark?'1':'0');applyTheme();}
if(matchMedia('(prefers-color-scheme:dark)').matches && localStorage.getItem('shelf-dark')===null) S.dark=true;
applyTheme();
</script>
</body>
</html>
