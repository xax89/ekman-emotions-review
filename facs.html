用。學完這章，你就有了一套可以照表操課的計分流程。","goals_zh":["會填 Score Sheet：姓名、日期、刺激來源、計分時間","牢記計分順序：先下臉 → 頭眼位置 → 再回上臉","完整掌握括號系統：(ref)、(or)、(L or Bi)、(A or B)、(or T/B)、(?)","用七步驟避免遺漏 AU 與組合互動——流程設計來減少粗心錯誤"],"prereq_zh":"Ch3 記號規則 + Ch2–9 全部 AU 與位置碼。","groups":[{"name":"記號","desc":"計分書寫規則總整理","items":[127]},{"name":"Score Sheet","desc":"正面計分欄與背面 Omission Check","items":[128]},{"name":"計分步驟","desc":"Steps I–VII 完整流程","items":[129]}]},"11":{"stage":4,"intro_zh":"進階計分技巧，面對真實研究情境：說話時的 AU 計分（AD 50）、把連續行為切分成「臉部事件」、單側動作與不對稱計分。這是把 FACS 從「教材」變成「研究工具」的最後一課。","goals_zh":["知道說話時的動作如何排除：AD 50 搭配「頂峰持續 >0.75 秒／跨一個音節」守則","理解「臉部事件」切分：把 AU 整合回事件再分析，比單獨統計 AU 更能區分情境","會用 L/R 記單側、用不對稱計分處理兩側肌肉差異","知道 1 單獨出現、1+2、1+2+4 是不同表情——不要只數 AU 出現次數"],"prereq_zh":"Ch10 計分程序 + 全部 AU（本章是收尾章）。","groups":[{"name":"說話時計分","desc":"AD 50 與語音動作的排除守則","items":[130]},{"name":"臉部事件切分","desc":"從連續行為中切出可分析的 AU 群","items":[131]},{"name":"單側與不對稱","desc":"L/R 記號與不對稱計分法","items":[132]}]}};

<script>
const LS = 'facs_review_';
let state = loadState();
function loadState(){
  const d = { quiz:{}, done:{}, fav:{}, wrong:{}, corrected:{}, terms:{}, marks:{},
    dark:false, mark:false, lastView:'home', lastCh:1 };
  try{ const s = JSON.parse(localStorage.getItem(LS+'state')); if(s) Object.assign(d, s); }catch(e){}
  return d;
}
function saveState(){ try{ localStorage.setItem(LS+'state', JSON.stringify(state)); }catch(e){} }
function qkey(ch,i){ return ch+'_'+i; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function imgPath(ref){
  const p = ref.split(':');
  return 'assets/p'+String(p[0]).padStart(3,'0')+'_'+p[1]+'.webp';
}
function itemImgs(idx){
  const list = ITEM_IMGS[idx] || [];
  if(!list.length) return '';
  const ppOf = f => Math.max(1, parseInt(f.slice(1)) - 12);
  const main = list[0];
  let h = `<figure class="img-main"><img src="assets/${main}" loading="lazy" alt="${esc(main)}"><figcaption>圖 p.${ppOf(main)}（示範圖）</figcaption></figure>`;
  if(list.length > 1){
    h += `<div class="img-thumbs">`;
    list.slice(1).forEach(f=>{ h += `<figure><img src="assets/${f}" loading="lazy" alt="${esc(f)}"><figcaption>圖 p.${ppOf(f)}</figcaption></figure>`; });
    h += `</div>`;
  }
  return h;
}
function getTypeLabel(t){ return {au:'AU',comb:'組合',ad:'AD',pos:'碼',sec:'節'}[t] || t; }
function chProgress(chNum){
  const qs = QUIZ.filter(q=>q.ch===chNum);
  let done = 0;
  qs.forEach(q=>{ const i=qs.indexOf(q); if(state.done[qkey(chNum,i)]) done++; });
  return qs.length ? Math.round(done/qs.length*100) : 0;
}
function totalStats(){
  let dq=0, fav=0, wrong=0;
  Object.keys(state.done).forEach(k=>{ if(state.done[k]) dq++; });
  Object.keys(state.fav).forEach(k=>{ if(state.fav[k]) fav++; });
  Object.keys(state.wrong).forEach(k=>{ if(state.wrong[k]) wrong++; });
  return {dq,fav,wrong};
}
const CH_PAGE_END = {1:14,2:72,3:90,4:144,5:174,6:230,7:294,8:328,9:348,10:356,11:376};
function showHome(){
  state.lastView='home'; saveState(); setActiveToc(-1);
  const t = totalStats();
  const STAGES=[
    {n:1,name:'入門',desc:'認識 FACS 的語言：AU 是什麼、術語怎麼用、怎麼學',chs:[1]},
    {n:2,name:'動作單元',desc:'上半臉 → 下半臉四群：學完所有 AU 與組合',chs:[2,3,4,5,6,7]},
    {n:3,name:'補充碼',desc:'雜項動作、頭眼位置與情境碼',chs:[8,9]},
    {n:4,name:'計分實務',desc:'正式計分程序與進階研究技巧',chs:[10,11]}
  ];
  const stageOf = chn => { const s=(GUIDES[chn]||{}).stage; return s||(chn<=1?1:chn<=7?2:chn<=9?3:4); };
  const chCard = ch => {
    const g = GUIDES[ch.num]||{};
    const pct = chProgress(ch.num);
    const one = (g.intro_zh||'').split('。')[0]+'。';
    return `<div class="ch-card" onclick="showChapter(${ch.num})">
      <div class="ch-top"><span class="stage-chip">${STAGES[stageOf(ch.num)-1].name}</span><h3>第 ${ch.num} 章 · ${esc(ch.title_zh)}</h3></div>
      <div class="en">${esc(ch.title_en)}</div>
      <p class="ch-oneline">${esc(one)}</p>
      <div class="meta">${ch.n_items} 項目 · ${ch.n_quiz} 題 · 印刷頁 p.${ch.print_start} 起</div>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <div class="pct">${pct}% 完成</div></div>`;
  };
  const stageCards = STAGES.map(s=>{
    const sum = s.chs.map(c=>chProgress(c)).reduce((a,b)=>a+b,0);
    const avg = Math.round(sum/s.chs.length);
    return `<div class="stage-card">
      <div class="stage-num">${s.n}</div>
      <div class="stage-body">
        <h3>${esc(s.name)}</h3><p>${esc(s.desc)}</p>
        <div class="stage-chs">${s.chs.map(c=>`<span class="stage-ch" onclick="event.stopPropagation();showChapter(${c})">Ch${c}</span>`).join('')}</div>
        <div class="bar"><i style="width:${avg}%"></i></div><div class="pct">${avg}% 完成</div>
      </div></div>`;
  }).join('');
  let resume='';
  if(state.lastCh && CHAPTERS.find(c=>c.num===state.lastCh)){
    const lc = CHAPTERS.find(c=>c.num===state.lastCh);
    resume = `<div class="resume-bar"><button class="resume-btn" onclick="showChapter(${lc.num})">繼續上次：第 ${lc.num} 章 · ${esc(lc.title_zh)}</button></div>`;
  }
  document.getElementById('main').innerHTML = `
  <div class="home-hero">
    <h1>${esc(BOOK_META.title)}</h1>
    <div class="sub">${esc(BOOK_META.subtitle)} · ${esc(BOOK_META.authors)}</div>
    <div class="sub" style="font-size:12.5px">互動複習版（英文原文 + 繁體中文摘要）· 所有項目標註原書頁碼</div>
    <div class="stats">
      <div class="stat"><b>${CHAPTERS.length}</b>章</div>
      <div class="stat"><b>${BOOK_META.total_items}</b>項目</div>
      <div class="stat"><b>${BOOK_META.total_quiz}</b>測驗題</div>
      <div class="stat"><b>${BOOK_META.total_imgs}</b>圖</div>
      <div class="stat"><b>${t.dq}/${BOOK_META.total_quiz}</b>已作答</div>
      <div class="stat"><b>${t.fav}</b>收藏</div>
      <div class="stat"><b>${t.wrong}</b>待訂正</div>
    </div></div>
  ${resume}
  <div class="sec-block"><h3>怎麼讀這本書</h3><div class="stage-grid">${stageCards}</div></div>
  <div class="sec-block"><h3>全部章節 <span class="cnt">依書的順序</span></h3><div class="ch-grid">${CHAPTERS.map(chCard).join('')}</div></div>`;
  window.scrollTo(0,0);
}
function guideCard(ch,g){
  return `<div class="guide-card">
    <div class="guide-badge">第 ${ch.num} 章 · 學習導讀</div>
    <p class="guide-intro">${esc(g.intro_zh||'')}</p>
    <div class="guide-cols">
      <div class="guide-col"><h4>這章教你</h4><ul>${(g.goals_zh||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>
      <div class="guide-col"><h4>先備知識</h4><p>${esc(g.prereq_zh||'')}</p></div>
    </div>
    <div class="guide-route"><h4>本章路線（依書的順序）</h4>
      <div class="route-steps">${(g.groups||[]).map(x=>`<span class="route-step">${esc(x.name)}</span>`).join('<span class="route-arrow">→</span>')}</div>
    </div>
  </div>`;
}
function secCard(it){
  const kps = it.keypoints_zh||[];
  const body = kps.length?`<ul class="kp-list">${kps.map(k=>`<li>${esc(k)}</li>`).join('')}</ul>`
    :(it.summary_zh?`<p class="sec-summary">${esc(it.summary_zh)}</p>`:'');
  return `<div class="know-card" id="item-${it.idx}">
    <div class="know-head" onclick="toggleItem(${it.idx})">
      <span class="arrow">&#9654;</span><span class="tag sec">${getTypeLabel(it.type)}</span>
      <span class="nm">${esc(it.name_en)}</span><span class="pg">p.${it.print_page}</span>
    </div>
    <div class="know-body">${body}</div></div>`;
}
function diffCard(it){
  const kps = it.keypoints_zh||[];
  return `<div class="diff-card" id="item-${it.idx}">
    <div class="diff-head" onclick="toggleItem(${it.idx})">
      <span class="arrow">&#9654;</span>
      <span class="nm">${esc(it.name_en)}</span><span class="pg">p.${it.print_page}</span>
    </div>
    <div class="diff-body"><ul>${kps.map(k=>`<li>${esc(k)}</li>`).join('')}</ul></div></div>`;
}
function auCard(it){
  const imgs = itemImgs(it.idx);
  let h = `<div class="au-card" id="item-${it.idx}">
    <div class="au-head" onclick="toggleItem(${it.idx})">
      <span class="arrow">&#9654;</span>
      <span class="tag ${it.type}">${getTypeLabel(it.type)}</span>
      <span class="nm">${esc(it.name_en)}</span><span class="nm-zh">${esc(it.name_zh||'')}</span>
      <span class="pg">p.${it.print_page}</span>
    </div>
    <div class="au-body">
      <div class="au-main">
      <div class="one-liner">${esc(it.summary_zh||'')}</div>`;
  if(it.appearance_zh && it.appearance_zh.length){
    h += `<div class="au-sec"><h4>判讀線索</h4><ul class="clue-grid">${it.appearance_zh.map(a=>`<li>${esc(a)}</li>`).join('')}</ul></div>`;
  }
  const mech=[];
  if(it.muscle_zh) mech.push(`<p class="mech-muscle">${esc(it.muscle_zh)}</p>`);
  if(it.howto_zh) mech.push(`<p class="mech-howto"><b>自己試試：</b>${esc(it.howto_zh)}</p>`);
  if(mech.length) h += `<div class="au-sec"><h4>肌肉與機制</h4>${mech.join('')}</div>`;
  if(it.intensity_zh) h += `<div class="au-sec"><h4>強度分級（A → E）</h4><p class="intensity-box">${esc(it.intensity_zh)}</p></div>`;
  if(it.distinctions_zh && it.distinctions_zh.length){
    h += `<div class="distinct"><h4>容易混淆</h4><ul>${it.distinctions_zh.map(d=>`<li>${esc(d)}</li>`).join('')}</ul></div>`;
  }
  if(it.combos_zh) h += `<div class="au-sec"><h4>相關組合</h4><div class="combo-chips">${esc(it.combos_zh).split(',').map(c=>`<span class="combo-chip">${esc(c.trim())}</span>`).join('')}</div></div>`;
  if(it.quotes_en && it.quotes_en.length){
    h += `<div class="au-sec"><h4>原文引用</h4>${it.quotes_en.map(q=>`<div class="quote-box">${esc(q)}</div>`).join('')}</div>`;
  }
  h += `<div class="src-note">詳細見 (p.${it.print_page})</div></div>`;
  if(imgs) h += `<div class="au-figcol">${imgs}</div>`;
  h += `</div></div>`;
  return h;
}
function showChapter(chNum){
  state.lastView='chapter'; state.lastCh=chNum; saveState();
  const ch = CHAPTERS.find(c=>c.num===chNum);
  if(!ch){ showHome(); return; }
  setActiveToc(chNum);
  const g = GUIDES[chNum]||{};
  const pct = chProgress(chNum);
  const items = ch.items.map(idx=>CONTENT[idx]);
  const qs = QUIZ.filter(q=>q.ch===chNum);
  const pend = CH_PAGE_END[chNum]||ch.print_start;
  const STAGE_NAMES=['','入門','動作單元','補充碼','計分實務'];
  let html = `<div class="ch-head">
    <div class="crumb">FACS · 第 ${chNum} 章 <span class="stage-chip">${STAGE_NAMES[g.stage]||''}</span></div>
    <h2>${esc(ch.title_zh)}</h2>
    <div class="en">${esc(ch.title_en)}</div>
    <div class="meta">${ch.items.length} 個項目 · ${qs.length} 題測驗 · 詳細見 (p.${ch.print_start}–${pend})</div>
    <div class="progress-row"><div class="bar"><i style="width:${pct}%"></i></div><span class="pct-text">${pct}%</span>
      <span class="view-tools">
        <button class="vt-btn" onclick="expandAll()">全部展開</button>
        <button class="vt-btn ghost" onclick="collapseAll()">全部收合</button>
      </span></div>
  </div>`;
  if(g.intro_zh) html += guideCard(ch,g);
  const secs = items.filter(i=>i.type==='sec');
  const diffs = secs.filter(s=>/subtle differences/i.test(s.name_en||''));
  const groups = g.groups||[];
  if(groups.length){
    groups.forEach((grp,gi)=>{
      const grpItems = (grp.items||[]).map(idx=>CONTENT[idx]).filter(Boolean).filter(it=>!diffs.includes(it));
      if(!grpItems.length) return;
      html += `<div class="group-block">
        <div class="group-head"><span class="g-num">${gi+1}</span>
        <div><h3>${esc(grp.name)}</h3>${grp.desc?`<span class="g-desc">${esc(grp.desc)}</span>`:''}</div></div>`;
      grpItems.forEach(it=>{ html += it.type==='sec'?secCard(it):auCard(it); });
      html += `</div>`;
    });
  } else {
    const rest = items.filter(i=>i.type!=='sec');
    if(rest.length){
      html += `<div class="group-block"><div class="group-head"><div><h3>本章項目</h3></div></div>${rest.map(auCard).join('')}</div>`;
    }
  }
  if(diffs.length){
    html += `<div class="diff-block"><h3>易混淆對照 <span class="cnt">${diffs.length} 張表（點擊展開）</span></h3>`;
    html += diffs.map(diffCard).join('');
    html += `</div>`;
  }
  html += `<div class="sec-block"><h3>本章測驗 <span class="cnt">${qs.length} 題</span></h3>`;
  qs.forEach((q,qi)=>{
    const key = qkey(q.ch,qi);
    const answered = state.quiz[key] ?? null;
    const done = state.done[key], fav = state.fav[key];
    html += `<div class="quiz-card" id="quiz-${key}">
      <div class="qhead"><span class="quiz-num">${qi+1}</span><span class="q">${esc(q.q)}</span></div>`;
    if(q.img_ref) html += `<div class="quiz-img"><img src="${imgPath(q.img_ref)}" loading="lazy" alt="看圖題"></div>`;
    html += `<ul class="quiz-opts">`;
    q.options.forEach((o,oi)=>{
      let cls='';
      if(answered!=null){ if(oi===q.answer) cls='correct'; else if(oi===answered) cls='wrong'; else cls='dim'; }
      html += `<li class="${cls}" onclick="${answered!=null?'':'answerQuiz('+q.ch+','+qi+','+oi+')'}">${String.fromCharCode(65+oi)}. ${esc(o)}</li>`;
    });
    html += `</ul>`;
    if(answered!=null){
      const ok = answered===q.answer;
      html += `<div class="quiz-feedback show ${ok?'ok':'no'}">${ok?'<b>正確！</b>':'<b>答錯</b> 正確答案：'+esc(q.options[q.answer])+'<br>'}${esc(q.explain||'')}</div>`;
    }
    html += `<div class="quiz-tools">
      <button class="qbtn ${done?'done':''}" onclick="toggleDone(${q.ch},${qi})">${done?'&#9745; 做過':'&#9744; 做過'}</button>
      <button class="qbtn ${fav?'on':''}" onclick="toggleFav(${q.ch},${qi})">${fav?'&#9733; 收藏':'&#9734; 收藏'}</button>
      <button class="qbtn" onclick="resetQuiz(${q.ch},${qi})">&#8635; 重做</button></div></div>`;
  });
  html += `</div>`;
  document.getElementById('main').innerHTML = html;
  window.scrollTo(0,0);
}
function toggleItem(idx){
  const el = document.getElementById('item-'+idx);
  if(el) el.classList.toggle('open');
}
function answerQuiz(ch,qi,oi){
  const key = qkey(ch,qi);
  const q = QUIZ.filter(x=>x.ch===ch)[qi];
  state.quiz[key]=oi; state.done[key]=true;
  if(oi===q.answer){ delete state.wrong[key]; }
  else { state.wrong[key]=true; delete state.corrected[key]; }
  saveState(); showChapter(ch);
  const el = document.getElementById('quiz-'+key);
  if(el) el.scrollIntoView({behavior:'smooth',block:'center'});
}
function toggleDone(ch,qi){ const k=qkey(ch,qi); state.done[k]=!state.done[k]; saveState(); showChapter(ch); }
function toggleFav(ch,qi){ const k=qkey(ch,qi); state.fav[k]=!state.fav[k]; saveState(); showChapter(ch); }
function expandAll(){ document.querySelectorAll('.au-card,.know-card,.diff-card').forEach(el=>el.classList.add('open')); }
function collapseAll(){ document.querySelectorAll('.au-card,.know-card,.diff-card').forEach(el=>el.classList.remove('open')); }
function resetQuiz(ch,qi){
  const k=qkey(ch,qi);
  delete state.quiz[k]; delete state.done[k]; delete state.wrong[k]; delete state.corrected[k]; delete state.fav[k];
  saveState(); showChapter(ch);
}
function showWrongBook(){
  state.lastView='wrong'; saveState(); setActiveToc(-1);
  const wrongKeys = Object.keys(state.wrong).filter(k=>state.wrong[k]);
  let html = `<div class="ch-head"><h2>錯題本</h2>
    <div class="en">答錯的題目自動收錄；標記「已訂正」後移出</div>
    <div class="meta">目前 ${wrongKeys.length} 題待訂正</div></div>`;
  if(!wrongKeys.length){
    html += `<div class="empty-msg">太棒了，目前沒有待訂正的題目。</div>`;
  } else {
    wrongKeys.forEach(k=>{
      const p = k.split('_');
      const ch = Number(p[0]), qi = Number(p[1]);
      const q = QUIZ.filter(x=>x.ch===ch)[qi];
      if(!q) return;
      html += `<div class="quiz-card">
        <div class="qhead"><span class="quiz-num">第${ch}章</span><span class="q">${esc(q.q)}</span></div>
        ${q.img_ref?`<div class="quiz-img"><img src="${imgPath(q.img_ref)}" loading="lazy" alt=""></div>`:''}
        <div class="quiz-feedback show no"><b>你的答案：</b>${esc(q.options[state.quiz[k]])}<br>
          <b>正確答案：</b>${esc(q.options[q.answer])}<br>${esc(q.explain||'')}</div>
        <div class="quiz-tools">
          <button class="qbtn" onclick="correctWrong(${ch},${qi})">&#10004; 已訂正（移出）</button>
          <button class="qbtn" onclick="resetQuiz(${ch},${qi});showWrongBook()">&#8635; 重做</button></div></div>`;
    });
  }
  document.getElementById('main').innerHTML = html;
  window.scrollTo(0,0);
}
function correctWrong(ch,qi){
  const k = qkey(ch,qi);
  delete state.wrong[k]; delete state.corrected[k];
  saveState(); showWrongBook();
}
function showGlossary(filter){
  state.lastView='glossary'; saveState(); setActiveToc(-1);
  let html = `<div class="ch-head"><h2>術語表</h2>
    <div class="en">肌肉基礎 × 動作單元對照（可打勾學會、篩選）</div></div>
  <div class="filter-bar">
    <button class="tb-btn ${!filter?'on':''}" onclick="showGlossary('')">全部</button>
    <button class="tb-btn ${filter==='au'?'on':''}" onclick="showGlossary('au')">動作單元</button>
    <button class="tb-btn ${filter==='muscle'?'on':''}" onclick="showGlossary('muscle')">肌肉</button>
    <button class="tb-btn ${filter==='sec'?'on':''}" onclick="showGlossary('sec')">章節</button></div>`;
  const terms = [];
  CONTENT.forEach(c=>{
    if((!filter||filter==='au') && c.type==='au') terms.push({en:c.name_en,zh:c.name_zh,def:c.summary_zh,key:'au_'+c.idx});
    if((!filter||filter==='muscle') && c.muscle_en) terms.push({en:c.muscle_en,zh:c.muscle_zh||'',def:'肌肉基礎（'+c.name_en+'）',key:'mus_'+c.idx});
    if((!filter||filter==='sec') && c.type==='sec') terms.push({en:c.name_en,zh:c.name_zh,def:c.summary_zh,key:'sec_'+c.idx});
  });
  const done = terms.filter(t=>state.terms[t.key]).length;
  html += `<div class="sec-block"><h3>${terms.length} 個條目 <span class="cnt">${done}/${terms.length} 已學會</span></h3>`;
  terms.forEach(t=>{
    const on = state.terms[t.key];
    html += `<div class="term-row">
      <span class="chk ${on?'on':''}" onclick="toggleTerm('${t.key}')">${on?'&#10003;':''}</span>
      <span class="en">${esc(t.en)}</span><span class="zh">${esc(t.zh)}</span>
      <span class="def">${esc(t.def)}</span></div>`;
  });
  html += `</div>`;
  document.getElementById('main').innerHTML = html;
  window.scrollTo(0,0);
}
function toggleTerm(key){
  state.terms[key] = !state.terms[key]; saveState();
  const fl = document.querySelector('.filter-bar .tb-btn.on');
  showGlossary(fl ? fl.textContent : '');
}
function doSearch(v){
  const box = document.getElementById('searchResults');
  v = v.trim();
  if(!v){ box.classList.remove('show'); box.innerHTML=''; return; }
  const q = v.toLowerCase();
  const results = [];
  CONTENT.forEach(c=>{
    const hay = (c.name_en+' '+(c.name_zh||'')+' '+(c.summary_zh||'')+' '+(c.appearance_zh||[]).join(' ')+' '+(c.keypoints_zh||[]).join(' ')).toLowerCase();
    if(hay.includes(q)) results.push({type:'項目',ch:c.ch,text:c.name_zh||c.name_en,sub:c.summary_zh,chNum:c.ch,idx:c.idx});
  });
  QUIZ.forEach(qq=>{
    if(qq.q.toLowerCase().includes(q)) results.push({type:'測驗',ch:qq.ch,text:qq.q.slice(0,50),sub:'第'+qq.ch+'章測驗',chNum:qq.ch,idx:-1});
  });
  results.sort((a,b)=>a.ch-b.ch);
  let h = '';
  results.slice(0,25).forEach(r=>{
    h += `<div class="sr-item" onclick="jumpToResult(${r.chNum},${r.idx})">
      <span class="t">${esc(r.text)}</span>
      <span class="c">${esc(r.sub||'')} · ${r.type} · 第${r.ch}章</span></div>`;
  });
  if(!h) h = '<div class="sr-item" style="color:var(--text2)">無結果</div>';
  box.innerHTML = h; box.classList.add('show');
}
function jumpToResult(chNum,idx){
  document.getElementById('searchResults').classList.remove('show');
  document.getElementById('searchInput').value = '';
  showChapter(chNum);
  if(idx>=0) setTimeout(()=>{
    const el = document.getElementById('item-'+idx);
    if(el){ el.classList.add('open'); el.scrollIntoView({behavior:'smooth',block:'start'}); }
  },80);
}
function renderToc(){
  const ul = document.getElementById('tocList');
  ul.innerHTML = CHAPTERS.map(ch=>{
    const pct = chProgress(ch.num);
    return `<li><a href="javascript:void(0)" data-ch="${ch.num}" onclick="showChapter(${ch.num})">
      <span class="ch-num">${ch.num}</span>
      <span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(ch.title_zh)}</span>
      <span class="toc-bar"><i style="width:${pct}%"></i></span>
      <span class="toc-pct">${pct}%</span></a></li>`;
  }).join('');
}
function setActiveToc(chNum){
  document.querySelectorAll('#tocList a').forEach(a=>{
    a.classList.toggle('active', Number(a.dataset.ch)===chNum);
  });
  if(chNum>0) document.getElementById('sidebar').classList.remove('open');
}
function toggleDark(){
  state.dark = !state.dark; saveState();
  document.body.classList.toggle('dark', state.dark);
}
function toggleMark(){
  state.mark = !state.mark; saveState();
  document.body.classList.toggle('mark-active', state.mark);
  const hint = document.getElementById('markHint');
  if(state.mark){ hint.style.display='block'; setTimeout(()=>hint.style.display='none',2500); }
  if(!state.mark) saveMarks();
}
function applyMarks(){
  document.querySelectorAll('#main p, #main li, #main .q, #main .summary, #main .en').forEach(el=>{
    const sel = el.textContent.trim().slice(0,40);
    if(state.marks[sel]) el.style.background = 'var(--mark)';
  });
}
function saveMarks(){
  document.querySelectorAll('#main p, #main li, #main .q, #main .summary, #main .en').forEach(el=>{
    const sel = el.textContent.trim().slice(0,40);
    if(el.style.background) state.marks[sel] = true;
  });
  saveState();
}
document.body.classList.toggle('dark', state.dark);
renderToc();
showHome();
</script>

</body>
</html>
